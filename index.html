<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dice Days</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{--tan:#B8A082;--bg:#121212;--surface:#1E1E1E;--card:#2A2A2A;--text:#FFF;--text2:#AAA;--success:#4CAF50;--yellow:#FFC107;--danger:#EF5350;--safe-top:env(safe-area-inset-top,20px);--safe-bot:env(safe-area-inset-bottom,0px)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);overflow:hidden;height:100dvh;display:flex;flex-direction:column}
.screen{display:none;flex-direction:column;flex:1;overflow:hidden}
.screen.active{display:flex}

.app-bar{padding:12px 16px;padding-top:calc(var(--safe-top)+8px);background:var(--surface);display:flex;align-items:center;justify-content:space-between;min-height:56px}
.app-bar h1{font-size:18px;font-weight:700}
.app-bar-right{display:flex;align-items:center;gap:8px}
.event-code{background:rgba(184,160,130,.15);color:var(--tan);font-weight:700;font-size:13px;padding:4px 10px;border-radius:12px}
.info-btn{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--text2);color:var(--text2);background:none;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}

.filters{display:flex;gap:8px;padding:8px 16px}
.filter-chip{padding:6px 14px;border-radius:16px;font-size:13px;font-weight:600;border:1px solid #555;color:var(--text2);cursor:pointer}
.filter-chip.active{background:var(--tan);color:#fff;border-color:var(--tan)}

.game-list{flex:1;overflow-y:auto;padding:8px 12px 90px;-webkit-overflow-scrolling:touch}

/* Shared swipeable card wrapper */
.swipe-wrap{position:relative;margin-bottom:10px;overflow:visible}
.wagon{position:absolute;top:0;height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border-radius:12px;color:#fff;z-index:0}
.wagon-hide{right:0;width:100%;background:var(--danger);justify-content:flex-end;padding-right:20px}
.wagon-interest{left:0;width:0;background:var(--success);overflow:hidden;white-space:nowrap;padding:0;border-radius:12px 0 0 12px}
.wagon-explain{left:0;width:0;background:var(--yellow);overflow:hidden;white-space:nowrap;padding:0;color:#000;border-radius:12px 0 0 12px}
.wagon.tappable{cursor:pointer;padding:0 14px;z-index:3}

/* Game card (used in list) */
.game-card{position:relative;background:var(--card);border-radius:12px;overflow:hidden;display:flex;align-items:stretch;z-index:2;touch-action:pan-y}
.game-cover{width:72px;min-height:80px;background-size:cover;background-position:center;flex-shrink:0;pointer-events:none}
.game-body{padding:8px 0 8px 10px;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;pointer-events:none}
.game-bottleneck{font-size:11px;color:var(--danger);font-weight:600;margin-bottom:1px}
.game-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-meta{font-size:12px;color:var(--text2);margin-top:2px}
.game-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.badge-neutral{background:rgba(255,255,255,.08);color:var(--text2)}
.badge-int-me{background:rgba(76,175,80,.2);color:var(--success)}
.badge-exp-me{background:rgba(255,193,7,.2);color:var(--yellow)}
.sweet-spot{width:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin:0 10px;pointer-events:none}

.bottom-nav{background:var(--surface);display:flex;border-top:1px solid #333;padding-bottom:var(--safe-bot)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 0;cursor:pointer;color:var(--text2);font-size:11px;gap:2px}
.nav-item.active{color:var(--tan)}
.nav-item .icon{font-size:22px}

/* Inbox card */
.inbox-list{flex:1;overflow-y:auto;padding:12px 12px 90px;-webkit-overflow-scrolling:touch}
.inbox-card{position:relative;background:var(--card);border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px;z-index:2;height:72px;touch-action:pan-y}
.inbox-card img{width:52px;height:52px;border-radius:8px;object-fit:cover;pointer-events:none}
.inbox-card-info{flex:1;min-width:0;pointer-events:none}
.inbox-card-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inbox-card-meta{font-size:12px;color:var(--text2)}

.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:100;display:none;align-items:center;gap:10px;white-space:nowrap;max-width:90vw}
.toast.show{display:flex}
.toast-undo{color:var(--tan);font-weight:700;cursor:pointer;border:none;background:none;font-size:13px;padding:0}

.detail-header{position:relative;height:200px;background-size:cover;background-position:center;flex-shrink:0}
.detail-header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:80px;background:linear-gradient(transparent,var(--bg))}
.btn-back{position:absolute;top:calc(var(--safe-top)+8px);left:12px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
.detail-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.detail-content{padding:0 16px 120px}
.detail-title-row{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.detail-title{font-size:20px;font-weight:700}
.detail-status{font-size:13px;margin-bottom:4px}
.detail-status.green{color:var(--success)}
.detail-status.red{color:var(--danger)}
.detail-desc{font-size:13px;color:var(--text2);margin-bottom:16px;line-height:1.4}
.detail-meta{color:var(--text2);font-size:13px;margin-bottom:12px}

.role-columns{display:flex;gap:16px;margin-bottom:16px}
.role-col{flex:1}
.role-col-header{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.role-col-title{font-size:14px;font-weight:700}
.role-add{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--tan);color:var(--tan);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;background:none}
.role-chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:3px;padding:4px 10px;border-radius:14px;font-size:12px;font-weight:500}
.chip-exp{background:rgba(255,193,7,.15);color:var(--yellow)}
.chip-sup{background:rgba(76,175,80,.15);color:var(--success)}
.chip-remove{font-size:10px;cursor:pointer;opacity:.7;margin-left:2px}
.chip-me-exp{background:rgba(255,193,7,.25);color:var(--yellow)}
.chip-me{background:rgba(184,160,130,.2);color:var(--tan)}

.interest-section{margin-bottom:16px}
.interest-header{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.interest-header .need-count{color:var(--success);font-size:13px}
.interest-chips{display:flex;flex-wrap:wrap;gap:5px}
.chip-interest{background:rgba(255,255,255,.08);color:var(--text)}
.chip-interest-me{background:rgba(184,160,130,.2);color:var(--tan)}
.chip-interest-me-exp{background:rgba(255,193,7,.25);color:var(--yellow)}
.chip-need-icon{color:var(--success);font-size:11px;margin-left:2px}

.action-bar{position:fixed;bottom:52px;left:0;right:0;padding:10px 16px;padding-bottom:calc(8px + var(--safe-bot));display:flex;gap:10px;background:linear-gradient(transparent,var(--bg) 20%)}
.action-btn{flex:1;padding:12px;border-radius:12px;font-size:13px;font-weight:700;border:none;cursor:pointer;text-align:center}
.btn-green{background:var(--success);color:#fff}
.btn-grey{background:#444;color:#aaa}
.btn-need{background:rgba(76,175,80,.15);color:var(--success);border:1.5px solid var(--success)}
.btn-need-off{background:#333;color:var(--text2);border:1.5px solid #555}

.picker-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:flex-end;justify-content:center}
.picker-overlay.show{display:flex}
.picker-sheet{background:var(--surface);border-radius:16px 16px 0 0;padding:20px 16px;padding-bottom:calc(20px + var(--safe-bot));width:100%;max-width:400px;max-height:60vh;overflow-y:auto}
.picker-title{font-size:16px;font-weight:700;margin-bottom:12px}
.picker-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #333;cursor:pointer}
.picker-check{width:22px;height:22px;border-radius:6px;border:2px solid #555;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.picker-check.checked{background:var(--tan);border-color:var(--tan);color:#fff}
.picker-name{font-size:14px}
.picker-close{margin-top:12px;width:100%;padding:10px;border-radius:10px;background:var(--tan);color:#fff;border:none;font-size:14px;font-weight:700;cursor:pointer}

.empty-state{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:15px;padding:40px;text-align:center}
</style>
</head>
<body>

<div id="screen-list" class="screen active">
  <div class="app-bar">
    <h1>Dice Days 12</h1>
    <span class="event-code">ABC123</span>
  </div>
  <div class="filters" id="filters"></div>
  <div class="game-list" id="game-list"></div>
</div>

<div id="screen-detail" class="screen">
  <div class="detail-header" id="detail-header">
    <button class="btn-back" onclick="showScreen('list')">&#8249;</button>
  </div>
  <div class="detail-scroll">
    <div class="detail-content" id="detail-content"></div>
  </div>
  <div class="action-bar" id="detail-actions"></div>
</div>

<div id="screen-inbox" class="screen">
  <div class="app-bar">
    <h1>Inbox</h1>
    <div class="app-bar-right">
      <button class="info-btn" onclick="toggleInboxInfo()">i</button>
    </div>
  </div>
  <div id="inbox-info" style="display:none;padding:8px 16px;font-size:12px;color:var(--text2);background:var(--surface);line-height:1.4">
    Wische nach <b style="color:var(--success)">rechts</b> für Interesse (weiter für Erklärbedarf). Wische nach <b style="color:var(--danger)">links</b> zum Ausblenden.
  </div>
  <div class="inbox-list" id="inbox-list"></div>
</div>

<div class="toast" id="toast"><span id="toast-text"></span><button class="toast-undo" id="toast-undo" onclick="undoLast()">Rückgängig</button></div>

<div class="picker-overlay" id="picker" onclick="if(event.target===this)closePicker()">
  <div class="picker-sheet">
    <div class="picker-title" id="picker-title"></div>
    <div id="picker-list"></div>
    <button class="picker-close" onclick="closePicker()">Fertig</button>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-item active" onclick="switchTab(this,'list')"><span class="icon">☰</span>Spiele</div>
  <div class="nav-item" onclick="switchTab(this,'inbox')"><span class="icon">✉</span>Inbox</div>
</div>

<script>
const ME='p-me';
const participants=[
  {id:'p-me',name:'Ich',initials:'DG'},
  {id:'p2',name:'Anna',initials:'AN'},
  {id:'p3',name:'Ben',initials:'BE'},
  {id:'p4',name:'Clara',initials:'CL'},
  {id:'p5',name:'David',initials:'DA'},
  {id:'p6',name:'Eva',initials:'EV'}
];
const pName=id=>(participants.find(p=>p.id===id)||{name:id}).name;

const games=[
  {id:'g1',name:'Wingspan',img:'https://cf.geekdo-images.com/yLZJCVLlIx4c7eJEWUNJ7w__thumb/img/VNToqgS2-pOGU6MuvIkMPKn_y-s=/fit-in/200x150/filters:strip_icc()/pic4458123.jpg',min:1,max:5,time:70,weight:2.5,interested:['p-me','p2','p3','p4'],explainers:['p2'],suppliers:['p-me'],needsExplain:['p-me'],hidden:[],status:'unplanned',desc:'Ein wunderschönes Spiel über Vögel und ihre Lebensräume.'},
  {id:'g2',name:'Brass: Birmingham',img:'https://cf.geekdo-images.com/x3zxjr-Vw5iU4yDPg70Jgw__thumb/img/-BIOKV4JAdtk1PBXNjc9bfcJJJQ=/fit-in/200x150/filters:strip_icc()/pic3490053.jpg',min:2,max:4,time:120,weight:3.9,interested:['p-me','p2','p3','p4','p5'],explainers:[],suppliers:['p3'],needsExplain:['p-me','p5'],hidden:[],status:'unplanned',desc:'Wirtschaftsstrategie im industriellen England.'},
  {id:'g3',name:'Cascadia',img:'https://cf.geekdo-images.com/MjeijZYjy4S-2GnjICKVpg__thumb/img/pOHUQ-hbWnMkFhrcJNwVXRiI_5s=/fit-in/200x150/filters:strip_icc()/pic5100691.jpg',min:1,max:4,time:45,weight:1.8,interested:['p-me','p2'],explainers:['p-me'],suppliers:['p2'],needsExplain:[],hidden:[],status:'unplanned',desc:'Tile-laying mit Tieren des pazifischen Nordwestens.'},
  {id:'g4',name:'Terraforming Mars',img:'https://cf.geekdo-images.com/wg9oOLcsKvDesSUdZQ4rxw__thumb/img/BTxqxgYay5tHJfVP6GKBJ0MzxGs=/fit-in/200x150/filters:strip_icc()/pic3536616.jpg',min:1,max:5,time:120,weight:3.2,interested:['p2','p3'],explainers:['p3'],suppliers:['p3'],needsExplain:[],hidden:[],status:'unplanned',desc:'Terraformt den roten Planeten für die Menschheit.'},
  {id:'g5',name:'Azul',img:'https://cf.geekdo-images.com/aPSHJO0d0XOpQR5X-wJonw__thumb/img/6oRUfQzFLNR8LMnFZ9LbOSnPjpM=/fit-in/200x150/filters:strip_icc()/pic3718275.jpg',min:2,max:4,time:30,weight:1.8,interested:['p-me'],explainers:['p-me'],suppliers:[],needsExplain:[],hidden:[],status:'unplanned',desc:'Maurische Fliesenmuster für den Palast.'},
  {id:'g6',name:'Spirit Island',img:'https://cf.geekdo-images.com/kjCm4ZvPjIZxS-mYgSPOgg__thumb/img/1jHBlBLIPMBbNzYFpCx0dZQbqJk=/fit-in/200x150/filters:strip_icc()/pic3615739.jpg',min:1,max:4,time:120,weight:4.0,interested:['p2','p3','p4'],explainers:['p4'],suppliers:['p4'],needsExplain:[],hidden:[],status:'unplanned',desc:'Kooperativ als Naturgeister gegen Kolonisatoren.'}
];

let currentFilter='all';
let lastAction=null;
let toastTimer=null;
let snappedCardId=null;

function flameSVG(sz){
  const w=sz*0.6,h=sz*0.85;
  const ox=(sz-w)/2,oy=(sz-h)/2;
  return`<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" fill="none"><path d="M${ox+w*.5},${oy} C${ox+w*.5},${oy+h*.35} ${ox+w},${oy+h*.25} ${ox+w},${oy+h*.6} C${ox+w},${oy+h*.85} ${ox+w*.75},${oy+h} ${ox+w*.5},${oy+h} C${ox+w*.25},${oy+h} ${ox},${oy+h*.85} ${ox},${oy+h*.6} C${ox},${oy+h*.25} ${ox+w*.5},${oy+h*.35} ${ox+w*.5},${oy}" stroke="var(--success)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function ssSVG(ratio,sz=36){
  if(ratio>1)return flameSVG(sz);
  const r=sz/2-2,c=sz/2,sw=3;
  const a=2*Math.PI*Math.min(ratio,1);
  const x=c+r*Math.sin(a),y=c-r*Math.cos(a);
  const lg=ratio>.5?1:0;
  const arc=ratio>0?`<path d="M${c},${c-r} A${r},${r} 0 ${lg} 1 ${x.toFixed(1)},${y.toFixed(1)}" fill="none" stroke="var(--success)" stroke-width="${sw}" stroke-linecap="round"/>`:'';
  return`<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${c}" cy="${c}" r="${r}" fill="none" stroke="#444" stroke-width="${sw}"/>${arc}</svg>`;
}

function bn(g){const b=[];if(!g.explainers.length)b.push('Kein Erklärer');if(!g.suppliers.length)b.push('Kein Lieferant');return b;}

// ===== SHARED SWIPE ENGINE =====
const SNAP_THRESHOLD=70;
const FLY_THRESHOLD=160;
const WAGON_W=90;
let touchState={};

function getTranslateX(el){
  const m=el.style.transform.match(/translateX\(([^)]+)\)/);
  return m?parseFloat(m[1]):0;
}

function swipeStart(e,key,cardEl){
  if(snappedCardId&&snappedCardId!==key)unsnapCard(snappedCardId);
  const t=e.touches[0];
  const cx=getTranslateX(cardEl);
  touchState[key]={startX:t.clientX,startY:t.clientY,offsetX:cx,moved:false};
  cardEl.style.transition='none';
}

function swipeMove(e,key,cardEl,wiEl,weEl){
  const ts=touchState[key];if(!ts)return;
  const t=e.touches[0];
  const dx=t.clientX-ts.startX;
  const dy=t.clientY-ts.startY;
  if(!ts.moved&&Math.abs(dy)>Math.abs(dx))return;
  ts.moved=true;
  e.preventDefault();
  const totalX=ts.offsetX+dx;
  cardEl.style.transform=`translateX(${totalX}px)`;
  if(totalX>0){
    const iw=Math.min(totalX,WAGON_W);
    wiEl.style.width=iw+'px';wiEl.style.padding=iw>20?'0 12px':'0';
    if(totalX>WAGON_W){
      const ew=Math.min(totalX-WAGON_W,WAGON_W);
      weEl.style.width=ew+'px';weEl.style.padding=ew>20?'0 12px':'0';weEl.style.left=iw+'px';
    }else{weEl.style.width='0';weEl.style.padding='0';}
  }else{
    wiEl.style.width='0';wiEl.style.padding='0';
    weEl.style.width='0';weEl.style.padding='0';
  }
}

function swipeEnd(key,cardEl,gid,context){
  const ts=touchState[key];if(!ts)return;
  const totalX=getTranslateX(cardEl);
  cardEl.style.transition='transform .3s ease';

  if(totalX<-FLY_THRESHOLD){
    cardEl.style.transform='translateX(-120%)';
    setTimeout(()=>{doHide(gid,context);},300);
  }else if(totalX>FLY_THRESHOLD){
    cardEl.style.transform='translateX(120%)';
    setTimeout(()=>{doInterest(gid,false,context);},300);
  }else if(totalX>=SNAP_THRESHOLD){
    snapCard(key,gid,context);
  }else{
    resetCard(key);
  }
  delete touchState[key];
}

function snapCard(key,gid,context){
  snappedCardId=key;
  const cardEl=document.getElementById('sc-'+key);
  const wiEl=document.getElementById('wi-'+key);
  const weEl=document.getElementById('we-'+key);
  const snapX=WAGON_W*2;
  cardEl.style.transition='transform .25s ease';
  cardEl.style.transform=`translateX(${snapX}px)`;
  wiEl.style.width=WAGON_W+'px';wiEl.style.padding='0 12px';
  weEl.style.width=WAGON_W+'px';weEl.style.padding='0 10px';weEl.style.left=WAGON_W+'px';
  wiEl.classList.add('tappable');weEl.classList.add('tappable');
  wiEl.onclick=()=>{doInterest(gid,false,context);};
  weEl.onclick=()=>{doInterest(gid,true,context);};
}

function unsnapCard(key){
  if(snappedCardId===key)snappedCardId=null;
  resetCard(key);
}

function resetCard(key){
  const cardEl=document.getElementById('sc-'+key);
  const wiEl=document.getElementById('wi-'+key);
  const weEl=document.getElementById('we-'+key);
  if(!cardEl)return;
  cardEl.style.transition='transform .25s ease';
  cardEl.style.transform='translateX(0)';
  wiEl.style.width='0';wiEl.style.padding='0';wiEl.classList.remove('tappable');wiEl.onclick=null;
  weEl.style.width='0';weEl.style.padding='0';weEl.classList.remove('tappable');weEl.onclick=null;
  if(snappedCardId===key)snappedCardId=null;
}

function doInterest(gid,withNeed,context){
  const g=games.find(x=>x.id===gid);if(!g)return;
  if(!g.interested.includes(ME))g.interested.push(ME);
  if(withNeed&&!g.needsExplain.includes(ME))g.needsExplain.push(ME);
  lastAction={type:'interest',id:gid,withNeed};
  snappedCardId=null;
  renderList();if(context==='inbox')renderInbox();
  showToast(`${g.name} — Interesse${withNeed?' + Erklärbedarf':''}`);
}

function doHide(gid,context){
  const g=games.find(x=>x.id===gid);if(!g)return;
  if(!g.hidden.includes(ME))g.hidden.push(ME);
  lastAction={type:'hide',id:gid};
  snappedCardId=null;
  renderList();if(context==='inbox')renderInbox();
  showToast(`${g.name} — ausgeblendet`);
}

function undoLast(){
  if(!lastAction)return;
  const g=games.find(x=>x.id===lastAction.id);if(!g)return;
  if(lastAction.type==='interest'){
    g.interested=g.interested.filter(p=>p!==ME);
    if(lastAction.withNeed)g.needsExplain=g.needsExplain.filter(p=>p!==ME);
  }else if(lastAction.type==='hide'){
    g.hidden=g.hidden.filter(p=>p!==ME);
  }
  lastAction=null;hideToast();
  renderList();renderInbox();
}

function attachSwipe(key,gid,context){
  const card=document.getElementById('sc-'+key);
  const wi=document.getElementById('wi-'+key);
  const we=document.getElementById('we-'+key);
  card.addEventListener('touchstart',e=>swipeStart(e,key,card),{passive:true});
  card.addEventListener('touchmove',e=>swipeMove(e,key,card,wi,we),{passive:false});
  card.addEventListener('touchend',()=>swipeEnd(key,card,gid,context));
}

// Tap vs swipe: open detail only if no swipe happened
let tapKey=null;
function onCardTap(gid,key){
  setTimeout(()=>{
    if(!touchState[key]||(touchState[key]&&!touchState[key].moved)){
      const card=document.getElementById('sc-'+key);
      if(card&&getTranslateX(card)===0) openDetail(gid);
    }
  },10);
}

// ===== GAME LIST =====
function renderFilters(){
  document.getElementById('filters').innerHTML=
    ['all','mine','bottleneck'].map((f,i)=>{
      const labels=['Alle','Meine','Engpass'];
      return`<div class="filter-chip${currentFilter===f?' active':''}" onclick="setFilter('${f}')">${labels[i]}</div>`;
    }).join('');
}
function setFilter(f){currentFilter=f;renderFilters();renderList();}

function renderList(){
  let list=games.filter(g=>!g.hidden.includes(ME));
  if(currentFilter==='mine')list=list.filter(g=>g.interested.includes(ME));
  if(currentFilter==='bottleneck')list=list.filter(g=>bn(g).length>0);
  const el=document.getElementById('game-list');
  el.innerHTML=list.map(g=>{
    const ratio=g.interested.length/g.max;
    const bns=bn(g);
    const bnText=bns.length?`<div class="game-bottleneck">${bns.join(' · ')}</div>`:'';
    let badges='';
    const intCount=g.interested.length;
    if(intCount>0){
      const meIn=g.interested.includes(ME);
      badges+=`<span class="badge ${meIn?'badge-int-me':'badge-neutral'}">${intCount} Interessenten</span>`;
    }
    g.explainers.forEach(e=>{
      const isMe=e===ME;
      const label=isMe?'Du erklärst':pName(e)+' erklärt';
      badges+=`<span class="badge ${isMe?'badge-exp-me':'badge-neutral'}">${label}</span>`;
    });
    const key='list-'+g.id;
    return`<div class="swipe-wrap">
      <div class="wagon wagon-hide">Ausblenden</div>
      <div class="wagon wagon-interest" id="wi-${key}">Interesse</div>
      <div class="wagon wagon-explain" id="we-${key}">Erklärbedarf</div>
      <div class="game-card" id="sc-${key}" data-gid="${g.id}">
        <div class="game-cover" style="background-image:url('${g.img}')"></div>
        <div class="game-body">${bnText}<div class="game-name">${g.name}</div>
          <div class="game-meta">${g.min}–${g.max} Sp. · ${g.time} Min · ${g.weight}</div>
          <div class="game-badges">${badges}</div></div>
        <div class="sweet-spot">${ssSVG(ratio)}</div>
      </div></div>`;
  }).join('');

  // Attach swipe + tap
  list.forEach(g=>{
    const key='list-'+g.id;
    attachSwipe(key,g.id,'list');
    const card=document.getElementById('sc-'+key);
    card.addEventListener('click',()=>{
      if(getTranslateX(card)===0&&!(touchState[key]&&touchState[key].moved)) openDetail(g.id);
    });
  });
}

// ===== DETAIL =====
let detailGameId=null;
function openDetail(id){
  detailGameId=id;
  const g=games.find(x=>x.id===id);if(!g)return;
  document.getElementById('detail-header').style.backgroundImage=`url('${g.img}')`;
  const ratio=g.interested.length/g.max;
  const bns=bn(g);
  const isExp=g.explainers.includes(ME);
  const isSup=g.suppliers.includes(ME);
  const isInt=g.interested.includes(ME);

  let statusLine='';
  if(bns.length) statusLine=`<div class="detail-status red">${bns.join(' · ')}</div>`;
  else if(isExp) statusLine=`<div class="detail-status green">Du erklärst dieses Spiel</div>`;
  else if(isSup) statusLine=`<div class="detail-status green">Du bringst dieses Spiel mit</div>`;

  const expChips=g.explainers.map(p=>{
    const cls=p===ME?'chip chip-me-exp':'chip chip-exp';
    const label=p===ME?'Du':pName(p);
    return`<span class="${cls}">${label}<span class="chip-remove" onclick="removeRole('${id}','explainers','${p}')">⊖</span></span>`;
  }).join('')||'<span style="color:var(--danger);font-size:12px">—</span>';

  const supChips=g.suppliers.map(p=>{
    const cls=p===ME?'chip chip-me':'chip chip-sup';
    const label=p===ME?'Du':pName(p);
    return`<span class="${cls}">${label}<span class="chip-remove" onclick="removeRole('${id}','suppliers','${p}')">⊖</span></span>`;
  }).join('')||'<span style="color:var(--danger);font-size:12px">—</span>';

  const needCount=g.needsExplain.length;
  const intHeader=`Interessenten ${g.interested.length}${needCount?` <span class="need-count">(❔ ${needCount})</span>`:''}`;
  const intChips=g.interested.map(p=>{
    const meAndExp=p===ME&&isExp;
    const isMe=p===ME;
    const cls=meAndExp?'chip chip-interest-me-exp':isMe?'chip chip-interest-me':'chip chip-interest';
    const needIcon=g.needsExplain.includes(p)?'<span class="chip-need-icon">❔</span>':'';
    return`<span class="${cls}">${pName(p)}${needIcon}</span>`;
  }).join('');

  document.getElementById('detail-content').innerHTML=`
    <div class="detail-title-row"><span class="detail-title">${g.name}</span>${ssSVG(ratio,28)}</div>
    <div class="detail-meta">${g.min}–${g.max} Spieler · ${g.time} Min · Gewicht ${g.weight}</div>
    ${statusLine}
    <div class="detail-desc">${g.desc||''}</div>
    <div class="role-columns">
      <div class="role-col">
        <div class="role-col-header"><span class="role-col-title">Erklärer</span><button class="role-add" onclick="openPicker('${id}','explainers')">+</button></div>
        <div class="role-chips">${expChips}</div>
      </div>
      <div class="role-col">
        <div class="role-col-header"><span class="role-col-title">Lieferant</span><button class="role-add" onclick="openPicker('${id}','suppliers')">+</button></div>
        <div class="role-chips">${supChips}</div>
      </div>
    </div>
    <div class="interest-section">
      <div class="interest-header">${intHeader}</div>
      <div class="interest-chips">${intChips||'<span style="color:var(--text2);font-size:12px">Noch keine Interessenten</span>'}</div>
    </div>`;

  let actions='';
  if(isInt){
    actions+=`<button class="action-btn btn-grey" onclick="toggleInterest('${id}')">♡̸ Interesse zurückziehen</button>`;
    if(!isExp){
      const hasNeed=g.needsExplain.includes(ME);
      actions+=`<button class="action-btn ${hasNeed?'btn-need':'btn-need-off'}" onclick="toggleNeed('${id}')">${hasNeed?'❔ Erklärbedarf an':'❔ Erklärbedarf aus'}</button>`;
    }
  }else{
    actions+=`<button class="action-btn btn-green" onclick="toggleInterest('${id}')">♥ Interesse bekunden</button>`;
  }
  document.getElementById('detail-actions').innerHTML=actions;
  showScreen('detail');
}

function toggleInterest(id){
  const g=games.find(x=>x.id===id);if(!g)return;
  const i=g.interested.indexOf(ME);
  if(i>=0){
    g.interested.splice(i,1);
    g.needsExplain=g.needsExplain.filter(p=>p!==ME);
    g.explainers=g.explainers.filter(p=>p!==ME);
    g.suppliers=g.suppliers.filter(p=>p!==ME);
  }else{
    g.interested.push(ME);
  }
  openDetail(id);renderList();
}

function toggleNeed(id){
  const g=games.find(x=>x.id===id);if(!g)return;
  const i=g.needsExplain.indexOf(ME);
  if(i>=0)g.needsExplain.splice(i,1);else g.needsExplain.push(ME);
  openDetail(id);
}

function removeRole(gid,role,pid){
  const g=games.find(x=>x.id===gid);if(!g)return;
  g[role]=g[role].filter(p=>p!==pid);
  openDetail(gid);renderList();
}

let pickerGame=null,pickerRole=null;
function openPicker(gid,role){
  pickerGame=gid;pickerRole=role;
  document.getElementById('picker-title').textContent=role==='explainers'?'Erklärer auswählen':'Lieferant auswählen';
  renderPicker();
  document.getElementById('picker').classList.add('show');
}
function renderPicker(){
  const g=games.find(x=>x.id===pickerGame);
  document.getElementById('picker-list').innerHTML=participants.map(p=>{
    const checked=g[pickerRole].includes(p.id);
    return`<div class="picker-item" onclick="togglePicker('${p.id}')">
      <div class="picker-check${checked?' checked':''}">${checked?'✓':''}</div>
      <span class="picker-name">${p.name}</span></div>`;
  }).join('');
}
function togglePicker(pid){
  const g=games.find(x=>x.id===pickerGame);
  const i=g[pickerRole].indexOf(pid);
  if(i>=0){g[pickerRole].splice(i,1);}
  else{
    g[pickerRole].push(pid);
    if(pickerRole==='explainers') g.needsExplain=g.needsExplain.filter(p=>p!==pid);
  }
  renderPicker();openDetail(pickerGame);renderList();
}
function closePicker(){document.getElementById('picker').classList.remove('show');}

// ===== INBOX =====
function toggleInboxInfo(){
  const el=document.getElementById('inbox-info');
  el.style.display=el.style.display==='none'?'block':'none';
}

function renderInbox(){
  const list=games.filter(g=>!g.interested.includes(ME)&&!g.hidden.includes(ME));
  const el=document.getElementById('inbox-list');
  if(!list.length){el.innerHTML='<div class="empty-state">Alles durchgesehen! 🎉</div>';return;}
  el.innerHTML=list.map(g=>{
    const key='inbox-'+g.id;
    return`<div class="swipe-wrap" style="height:72px">
      <div class="wagon wagon-hide">Ausblenden</div>
      <div class="wagon wagon-interest" id="wi-${key}">Interesse</div>
      <div class="wagon wagon-explain" id="we-${key}">Erklärbedarf</div>
      <div class="inbox-card" id="sc-${key}">
        <img src="${g.img}" alt="">
        <div class="inbox-card-info">
          <div class="inbox-card-name">${g.name}</div>
          <div class="inbox-card-meta">${g.min}–${g.max} Sp. · ${g.time} Min</div>
        </div>
        <div style="pointer-events:none">${ssSVG(g.interested.length/g.max,30)}</div>
      </div>
    </div>`;
  }).join('');

  list.forEach(g=>{
    const key='inbox-'+g.id;
    attachSwipe(key,g.id,'inbox');
  });
}

// ===== NAV =====
function showScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
}
function switchTab(el,screen){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  showScreen(screen);
  if(screen==='inbox')renderInbox();
}

function showToast(msg){
  clearTimeout(toastTimer);
  document.getElementById('toast-text').textContent=msg;
  document.getElementById('toast').classList.add('show');
  toastTimer=setTimeout(hideToast,3500);
}
function hideToast(){document.getElementById('toast').classList.remove('show');}

renderFilters();renderList();
</script>
</body>
</html>
