<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dice Days</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#111;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;font-family:'Segoe UI',sans-serif;color:var(--text)}
#app{position:relative;width:100%;max-width:430px;height:100svh;height:100vh;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
:root{--tan:#B8A082;--surface:#252525;--card:#2e2e2e;--text:#e8e8e8;--muted:#aaa;--red:#e05555;--green:#5a9e6f;--yellow:#d4a017;--bg:#1a1a1a}
:root.light{--tan:#8B6E4E;--surface:#f0ede8;--card:#ffffff;--text:#1a1a1a;--muted:#777;--red:#c0392b;--green:#2e7d4f;--yellow:#b8860b;--bg:#e8e4de}
body.light{background:#ccc}
.screen{display:none;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.screen.active{display:flex}
.app-bar{display:flex;align-items:center;padding:12px 16px;background:var(--surface);border-bottom:1px solid #333;gap:8px;flex-shrink:0;position:relative}
.app-bar-title{font-size:17px;font-weight:700;color:var(--tan);flex:1;cursor:pointer;user-select:none;background:none;border:none;text-align:left;padding:0}
.icon-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;line-height:1;display:flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:6px}
.icon-btn:hover{background:#333}
.scroll-area{flex:1;overflow-y:auto;padding:12px;min-height:0}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;position:relative;color:var(--text)}
.badge{background:var(--red);color:#fff;border-radius:10px;font-size:10px;font-weight:700;padding:2px 6px;min-width:18px;text-align:center;display:inline-block}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600}
.btn-primary{background:var(--tan);color:#111}
.btn-ghost{background:none;border:1px solid var(--tan);color:var(--tan)}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
input,select,textarea{background:var(--surface);border:1px solid #444;color:var(--text);border-radius:8px;padding:8px 10px;font-size:14px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--tan)}
label{color:var(--muted);font-size:12px;display:block;margin-bottom:4px;margin-top:10px}
.bottom-nav{display:flex;background:var(--surface);border-bottom:1px solid #333;flex-shrink:0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.bottom-nav::-webkit-scrollbar{display:none}
/* Game card rich layout */
.game-card-cover{width:64px;min-height:72px;border-radius:8px;object-fit:cover;flex-shrink:0;background:var(--surface)}
.game-card-cover-ph{width:64px;min-height:72px;border-radius:8px;background:var(--surface);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
/* Detail screen */
.detail-header{position:relative;height:200px;background-size:cover;background-position:center;flex-shrink:0}
.detail-header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:80px;background:linear-gradient(transparent,var(--bg))}
.btn-back{position:absolute;top:8px;left:12px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
.detail-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.detail-content{padding:0 16px 120px}
.detail-title-row{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.detail-title{font-size:20px;font-weight:700}
.detail-status{font-size:13px;margin-bottom:4px}
.detail-status.green{color:var(--green)}
.detail-status.red{color:var(--red)}
.detail-desc{font-size:13px;color:var(--muted);margin-bottom:12px;line-height:1.5}
.detail-meta{color:var(--muted);font-size:13px;margin-bottom:8px}
.detail-links{display:flex;gap:8px;margin-bottom:16px}
.detail-link-btn{flex:1;padding:8px 12px;border-radius:10px;border:1px solid #444;color:var(--muted);background:none;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.role-columns{display:flex;gap:16px;margin-bottom:16px}
.role-col{flex:1}
.role-col-header{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.role-col-title{font-size:14px;font-weight:700}
.role-add{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--tan);color:var(--tan);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;background:none}
.role-chips{display:flex;flex-wrap:wrap;gap:5px}
.quick-role-btn{margin-top:8px;padding:7px 0;border-radius:10px;border:1.5px solid var(--tan);color:var(--tan);background:rgba(184,160,130,.15);font-size:12px;font-weight:700;cursor:pointer;width:100%;text-align:center;transition:background .15s}.quick-role-btn:active{background:rgba(184,160,130,.3)}
.role-add-circle{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--tan);color:var(--tan);display:inline-flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;background:rgba(184,160,130,.12);line-height:1;cursor:pointer;flex-shrink:0;padding:0}
.chip{display:inline-flex;align-items:center;gap:3px;padding:5px 11px;border-radius:14px;font-size:12px;font-weight:600}
.chip-exp{background:rgba(212,160,23,.28);color:#f0c040;border:1px solid rgba(212,160,23,.4)}
.chip-sup{background:rgba(212,160,23,.22);color:#e8b830;border:1px solid rgba(212,160,23,.35)}
.chip-rm{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:rgba(224,85,85,.35);color:#ff8080;font-size:10px;cursor:pointer;margin-left:3px;font-weight:700;flex-shrink:0}
.chip-me-exp{background:rgba(212,160,23,.45);color:#ffd04a;border:1px solid rgba(212,160,23,.65)}
.chip-me{background:rgba(212,160,23,.32);color:#f0c040;border:1px solid rgba(212,160,23,.5)}
.interest-section{margin-bottom:16px}
.interest-header{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.interest-chips{display:flex;flex-wrap:wrap;gap:5px}
.chip-interest{background:rgba(90,158,111,.22);color:#6fd68a;border:1px solid rgba(90,158,111,.35)}
.chip-interest-me{background:rgba(90,158,111,.38);color:#7fe89a;border:1px solid rgba(90,158,111,.55)}
.chip-interest-me-exp{background:rgba(90,158,111,.45);color:#8ffaaa;border:1px solid rgba(90,158,111,.65)}
.action-bar{position:absolute;bottom:0;left:0;right:0;padding:10px 16px 16px;display:flex;gap:10px;background:linear-gradient(transparent,var(--bg) 20%)}
.action-btn{flex:1;padding:12px;border-radius:12px;font-size:13px;font-weight:700;border:none;cursor:pointer;text-align:center}
.btn-green{background:var(--green);color:#fff}
.btn-grey{background:#444;color:#aaa}
.detail-img{width:80px;height:80px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--surface)}
.detail-img-ph{width:80px;height:80px;border-radius:10px;background:var(--surface);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
.participant-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:20px;font-size:12px;font-weight:700;margin:3px}
.nav-btn{flex:0 0 auto;display:flex;flex-direction:row;align-items:center;justify-content:center;padding:9px 18px;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:11px;font-weight:600;cursor:pointer;gap:4px;position:relative;white-space:nowrap}
.nav-btn svg{opacity:.6}
.nav-btn.active{color:var(--tan);border-bottom-color:var(--tan)}
.nav-btn.active svg{opacity:1;stroke:var(--tan)}
.nav-dot{position:absolute;top:6px;right:calc(50% - 14px);width:6px;height:6px;background:var(--red);border-radius:50%}
/* Tabs */
.tabs{display:flex;background:var(--surface);border-bottom:1px solid #333;flex-shrink:0}
.tab{flex:1;padding:10px 4px;background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;border-bottom:2px solid transparent;position:relative}
.tab.active{color:var(--tan);border-bottom-color:var(--tan)}
.tab-dot{display:inline-block;width:6px;height:6px;background:var(--red);border-radius:50%;margin-left:3px;vertical-align:middle}
/* Game card */
.game-card{background:var(--card);border-radius:12px;margin-bottom:10px;overflow:hidden;position:relative;touch-action:pan-y;z-index:2}
.game-card-inner{padding:12px}
.game-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:10px;padding:2px 7px;border-radius:10px;background:#333;color:var(--muted)}
.tag.tan{background:rgba(184,160,130,.2);color:var(--tan)}
.tag.yellow{background:rgba(212,160,23,.2);color:var(--yellow)}
/* Zugwaggon swipe */
.swipe-wrap{position:relative;overflow:visible}
.wagon{position:absolute;top:0;height:100%;display:flex;align-items:center;font-size:12px;font-weight:700;border-radius:12px;color:#fff;z-index:0;overflow:hidden;white-space:nowrap}
.wagon-hide{right:0;width:100%;background:var(--red);justify-content:flex-end;padding-right:20px}
.wagon-interest{left:0;width:0;background:var(--green);padding:0;border-radius:12px 0 0 12px}
.wagon-explain{left:0;width:0;background:var(--yellow);padding:0;color:#111;border-radius:12px 0 0 12px}
.wagon.tappable{cursor:pointer;padding:0 14px;z-index:3}
.swipe-wrap .game-card{margin-bottom:0}
.btn-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
/* Time bar */
.time-bar-wrap{margin:8px 0}
.time-bar-track{background:#222;border-radius:5px;height:8px;display:flex;position:relative}
.time-bar-track.overplanned{outline:2px solid var(--red);border-radius:5px}
.time-bar-seg{height:100%;transition:width .3s}
.time-bar-legend{display:flex;gap:10px;margin-top:5px;flex-wrap:wrap}
.tbl-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted)}
.tbl-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.overplanned-label{color:var(--red);font-size:11px;font-weight:700;margin-top:3px}
/* Sort bar */
.sort-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid #333;flex-shrink:0}
.sort-bar select{flex:1;font-size:12px;padding:5px 8px}
/* Swipe hint */
.swipe-hint{background:#2a2a2a;border-radius:8px;padding:8px 12px;font-size:11px;color:var(--muted);text-align:center;margin-bottom:10px;letter-spacing:.2px}
/* Section header */
.sec-hdr{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin:14px 0 6px}
/* Trade */
.trade-direction{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.trade-arrow{color:var(--tan);font-size:14px}
/* PayPal banner */
.paypal-banner{background:var(--card);border:1px solid #3a3a3a;border-radius:10px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.paypal-banner .pp-text{flex:1;color:var(--muted);font-size:13px}
.paypal-banner .pp-btn{background:none;border:1px solid var(--tan);color:var(--tan);border-radius:6px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
/* Admin */
.admin-section{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px}
.admin-section h3{font-size:13px;font-weight:700;color:var(--tan);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.toggle-switch{position:relative;width:44px;height:24px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{position:absolute;inset:0;background:#444;border-radius:12px;cursor:pointer;transition:.3s}
.toggle-slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#aaa;border-radius:50%;transition:.3s}
input:checked + .toggle-slider{background:var(--tan)}
input:checked + .toggle-slider:before{transform:translateX(20px);background:#fff}
.participant-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #333}
.participant-row:last-child{border-bottom:none}
.p-avatar{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0}
/* Banner */
.msg-banner{background:linear-gradient(135deg,#3a2a10,#4a3a20);border:1px solid var(--tan);border-radius:10px;padding:14px;margin-bottom:10px}
.msg-banner p{font-size:13px;color:var(--text);margin-bottom:10px}
/* Poll */
.poll-card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px}
.poll-option{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid #444;margin-top:6px;cursor:pointer;transition:border-color .2s}
.poll-option.voted{border-color:var(--tan);background:rgba(184,160,130,.1)}
.poll-bar{background:var(--tan);height:3px;border-radius:2px;margin-top:4px;transition:width .3s}
/* Join screen */
.join-screen{position:absolute;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}
.join-screen h2{color:var(--tan);font-size:20px;font-weight:700;margin-bottom:6px}
.join-screen p{color:var(--muted);font-size:13px;text-align:center;margin-bottom:20px}
/* Overlays */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.75);z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:60px}
.overlay.show{display:flex}
.overlay-box{background:var(--surface);border-radius:14px;padding:20px;width:calc(100% - 32px);max-width:380px}
.overlay-box h3{color:var(--tan);font-size:15px;font-weight:700;margin-bottom:14px}
/* Avatar */
.avatar-btn{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--tan);background:var(--card);color:var(--tan);font-size:10px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;letter-spacing:.5px}
/* Event dropdown */
.event-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid #333;border-top:none;z-index:150;display:none}
.event-dropdown.show{display:block}
.event-dd-item{padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:8px;border-bottom:1px solid #333;font-size:13px;color:var(--text)}
.event-dd-item:last-child{border-bottom:none}
.event-dd-item:hover{background:#333}
/* Schedule */
.sched-display{background:var(--card);border-radius:10px;padding:12px;margin-bottom:12px}
.sched-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;border-bottom:1px solid #333}
.sched-row:last-child{border-bottom:none}
.sched-label{color:var(--muted)}
/* Packliste */
.pack-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #333;color:var(--text)}
.pack-item:last-child{border-bottom:none}
.pack-item input[type=checkbox]{width:17px;height:17px;flex-shrink:0;accent-color:var(--tan)}
.pack-item.done span{text-decoration:line-through;color:var(--muted)}
.inline-add{display:flex;gap:8px;margin-top:10px}
.inline-add input{flex:1}
/* VP code */
.vp-code{font-size:11px;background:#333;padding:2px 6px;border-radius:4px;font-family:monospace;letter-spacing:1px;color:var(--tan)}
/* Avatar dropdown */
.avatar-menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:11px 14px;background:none;border:none;color:var(--text);font-size:13px;cursor:pointer;text-align:left}
.avatar-menu-item:hover{background:#333}
.avatar-menu-item:first-child{border-radius:10px 10px 0 0}
.avatar-menu-item:last-child{border-radius:0 0 10px 10px}
/* Admin tabs */
.admin-tabs{display:flex;border-bottom:1px solid #333;margin-bottom:12px;overflow-x:auto}
.admin-tab{flex:1;min-width:70px;padding:8px 4px;background:none;border:none;color:var(--muted);font-size:11px;cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.admin-tab.active{color:var(--tan);border-bottom-color:var(--tan)}
/* Banner trigger */
.trigger-row{display:flex;gap:8px;margin-top:8px}
.trigger-opt{flex:1;padding:8px;border-radius:8px;border:1px solid #444;background:none;color:var(--muted);font-size:12px;cursor:pointer;text-align:center}
.trigger-opt.active{border-color:var(--tan);color:var(--tan)}
#toast{position:absolute;bottom:16px;left:12px;right:12px;background:#3a3a3a;color:var(--text);border-radius:12px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;font-size:13px;z-index:1000;transform:translateY(100px);transition:transform .25s ease;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,.4)}
#toast.show{transform:translateY(0);pointer-events:auto}
.toast-undo{background:none;border:none;color:var(--tan);font-size:13px;font-weight:700;cursor:pointer;padding:0;flex-shrink:0}
</style>
</head>
<body>
<div id="app">

<!-- JOIN SCREEN -->
<div class="join-screen" id="join-screen" style="display:none">
  <h2>Willkommen</h2>
  <p>Gib den Event-Code ein, um einem Event beizutreten.</p>
  <div style="width:100%;max-width:320px">
    <label>Event-Code</label>
    <input id="join-code" placeholder="z.B. KXMP7Q" style="text-transform:uppercase;letter-spacing:2px;font-size:16px;text-align:center">
    <div id="join-pw-wrap" style="display:none">
      <label>Passwort</label>
      <input id="join-pw" type="password" placeholder="Event-Passwort">
    </div>
    <div id="join-err" style="color:var(--red);font-size:12px;margin-top:6px;display:none"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:16px" onclick="submitJoinEvent()">Beitreten</button>
    <button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="hideJoinScreen()">Abbrechen</button>
  </div>
</div>

<!-- AVATAR DROPDOWN -->
<div id="avatar-dropdown" style="display:none;position:absolute;top:52px;right:12px;z-index:200;background:var(--surface);border:1px solid #444;border-radius:10px;min-width:180px;box-shadow:0 4px 20px rgba(0,0,0,.4)">
  <button class="avatar-menu-item" onclick="closeAvatarMenu();showScreen('admin')">
    <span id="ami-settings"></span>Admin-Bereich
  </button>
  <button class="avatar-menu-item" onclick="closeAvatarMenu();openSettingsOverlay()">
    <span id="ami-tune"></span>Einstellungen
  </button>
  <div style="border-top:1px solid #333;margin:2px 0"></div>
  <button class="avatar-menu-item" onclick="closeAvatarMenu();openUserOverlay()">
    <span id="ami-users"></span>Benutzer wechseln
  </button>
</div>

<!-- SETTINGS OVERLAY -->
<div class="overlay" id="settings-overlay">
  <div class="overlay-box">
    <h3>Einstellungen</h3>
    <div class="toggle-row">
      <span style="font-size:13px;color:var(--text)">Dark Mode</span>
      <label class="toggle-switch"><input type="checkbox" id="dark-mode-toggle" checked onchange="toggleDarkMode(this.checked)"><span class="toggle-slider"></span></label>
    </div>
    <div class="toggle-row">
      <span style="font-size:13px;color:var(--text)">Button-Modus</span>
      <label class="toggle-switch"><input type="checkbox" id="settings-control-toggle" checked onchange="controlMode=this.checked?'button':'swipe';updateModeBtn();renderAll()"><span class="toggle-slider"></span></label>
    </div>
    <div style="border-top:1px solid #333;margin-top:14px;padding-top:14px">
      <div style="font-size:13px;font-weight:700;color:var(--tan);margin-bottom:10px;text-transform:uppercase;letter-spacing:.5px">Meine BGG-Collection</div>
      <label>BGG-Benutzername</label>
      <input id="bgg-username" placeholder="dein BGG-Username">
      <label>BGG-Passwort (optional, für private Collections)</label>
      <div style="position:relative">
        <input id="bgg-password" type="password" placeholder="Passwort">
        <button id="bgg-eye-btn" onclick="toggleBggPw()" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;padding:4px;display:flex;align-items:center"></button>
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="syncBggCollection()">Collection synchronisieren</button>
      <div id="bgg-sync-status" style="font-size:11px;color:var(--muted);margin-top:6px;text-align:center"></div>
    </div>
    <button class="btn btn-ghost" style="width:100%;margin-top:14px" onclick="closeOverlay('settings-overlay')">Schließen</button>
  </div>
</div>

<!-- USER OVERLAY -->
<div class="overlay" id="user-overlay">
  <div class="overlay-box">
    <h3>Benutzer wechseln</h3>
    <div id="user-list-ul"></div>
    <div style="margin-top:14px;border-top:1px solid #333;padding-top:12px">
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px">Neuen Benutzer anlegen</div>
      <input id="new-user-name" placeholder="Name">
      <label>Passwort (optional)</label>
      <input id="new-user-pw" type="password" placeholder="Passwort">
      <button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="createNewUser()">Anlegen</button>

// ============================================================
function getScheduleMinutes(){
  var ev=currentEvent(),sched=mySchedule();
  if(!ev)return{total:0,sleep:0};
  var src=(sched&&sched.saved)?sched:ev;
  function toMin(d,t){return new Date(d+'T'+t).getTime()/60000;}
  var total=Math.max(0,toMin(src.departureDate||ev.departureDate,src.departureTime||ev.departureTime)-toMin(src.arrivalDate||ev.arrivalDate,src.arrivalTime||ev.arrivalTime));
  var sleep=0;
  if(src.sleepStart&&src.sleepEnd){
    var ss=parseInt(src.sleepStart)*60+parseInt(src.sleepStart.split(':')[1]);
    var se=parseInt(src.sleepEnd)*60+parseInt(src.sleepEnd.split(':')[1]);
    if(se<=ss)se+=1440;
    var nights=Math.round(total/1440);if(nights<1)nights=1;
    sleep=Math.min((se-ss)*nights,total*0.7);
  }
  return{total:total,sleep:sleep};
}
function getTimePlan(){
  var me=ME(),games=currentGames(),erkTime=0,mitTime=0,erkGames=[],mitGames=[];
  games.forEach(function(g){
    if(g.wish||g.ignored)return;
    var amExp=me&&g.explainers.indexOf(me)>=0,amInt=me&&g.interested.indexOf(me)>=0;
    if(amExp){erkTime+=(g.erkTime||g.duration||0);erkGames.push(g);}
    else if(amInt){mitTime+=(g.duration||0);mitGames.push(g);}
  });
  return{erkTime:erkTime,mitTime:mitTime,erkGames:erkGames,mitGames:mitGames};
}
function renderUnifiedTimeBar(containerId){
  var el=document.getElementById(containerId);if(!el)return;
  var sched=getScheduleMinutes(),plan=getTimePlan();
  if(!sched.total){el.innerHTML='';return;}
  var total=sched.total,sleep=sched.sleep,erk=plan.erkTime,mit=plan.mitTime;
  var used=erk+mit+sleep,over=used>total;
  var ep=Math.min(erk/total*100,100),mp=Math.min(mit/total*100,Math.max(0,100-ep)),sp=Math.min(sleep/total*100,Math.max(0,100-ep-mp));
  function fh(m){var h=Math.floor(m/60),mn=Math.round(m%60);return h>0?h+'h'+(mn?mn+'m':''):mn+'m';}
  el.innerHTML='<div style="font-size:10px;color:var(--muted);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px">Zeitplanung</div>'+
    '<div class="time-bar-track'+(over?' overplanned':'')+'">'+
      '<div class="time-bar-seg" style="width:'+ep+'%;background:var(--yellow)"></div>'+
      '<div class="time-bar-seg" style="width:'+mp+'%;background:var(--tan)"></div>'+
      '<div class="time-bar-seg" style="width:'+sp+'%;background:#3a3060"></div>'+
    '</div>'+
    (over?'<div class="overplanned-label">'+ICO.alert.replace('width="20"','width="12"').replace('height="20"','height="12"')+' +'+fh(used-total)+' überplant</div>':'')+
    '<div class="time-bar-legend">'+
      '<span class="tbl-item"><span class="tbl-dot" style="background:var(--yellow)"></span>Erklären '+fh(erk)+'</span>'+
      '<span class="tbl-item"><span class="tbl-dot" style="background:var(--tan)"></span>Mitspielen '+fh(mit)+'</span>'+
      '<span class="tbl-item"><span class="tbl-dot" style="background:#3a3060;border:1px solid #555"></span>Schlaf '+fh(sleep)+'</span>'+
      '<span class="tbl-item" style="margin-left:4px">/ '+fh(total)+'</span>'+
    '</div>';
}

var userBggSettings={};
function syncBggCollection(){
  var username=document.getElementById('bgg-username').value.trim();
  if(!username){alert('Bitte BGG-Benutzernamen eingeben');return;}
  var evId=currentEventId();if(!evId)return;
  var status=document.getElementById('bgg-sync-status');
  status.textContent='Verbinde mit BGG...';
  status.style.color='var(--muted)';
  userBggSettings[currentUserId]={username:username};
  fetchBggCollection(username,0,evId,status);
}
function fetchBggCollection(username,attempt,evId,status){
  var url='https://boardgamegeek.com/xmlapi2/collection?username='+encodeURIComponent(username)+'&own=1&excludesubtype=boardgameexpansion&stats=1';
  fetch(url).then(function(r){
    if(r.status===202){
      if(attempt<5){
        status.textContent='BGG bereitet Daten vor… ('+(attempt+1)+'/5)';
        setTimeout(function(){fetchBggCollection(username,attempt+1,evId,status);},3000+attempt*2000);
      }else{status.textContent='Timeout – bitte erneut versuchen.';status.style.color='var(--red)';}
      return;
    }
    if(!r.ok){status.textContent='Fehler: '+r.status;status.style.color='var(--red)';return;}
    return r.text();
  }).then(function(xml){
    if(!xml)return;
    var parser=new DOMParser(),doc=parser.parseFromString(xml,'text/xml');
    var items=doc.querySelectorAll('item');
    var added=0,skipped=0;
    var existing=eventGames[evId]||[];
    var me=ME();
    items.forEach(function(item){
      var name=(item.querySelector('name')||{}).textContent||'';
      var bggId=item.getAttribute('objectid');
      var bggUrl=bggId?'https://boardgamegeek.com/boardgame/'+bggId:'';
      var playingtime=item.querySelector('stats');
      var duration=playingtime?parseInt(playingtime.getAttribute('playingtime'))||null:null;
      var minp=playingtime?playingtime.getAttribute('minplayers'):'';
      var maxp=playingtime?playingtime.getAttribute('maxplayers'):'';
      var players=(minp&&maxp&&minp!==maxp)?minp+'–'+maxp:(minp||'');
      var avgEl=item.querySelector('average');
      var complexity=null;
      var wAvgEl=item.querySelector('averageweight');
      if(wAvgEl)complexity=Math.round(parseFloat(wAvgEl.getAttribute('value'))*10)/10;
      var thumbEl=item.querySelector('thumbnail');
      var img=thumbEl?thumbEl.textContent.trim():'';
      var alreadyIn=existing.some(function(g){return g.bgg===bggUrl||(g.name.toLowerCase()===name.toLowerCase());});
      if(alreadyIn){skipped++;return;}
      var g={id:'g'+Date.now()+Math.random().toString(36).slice(2,6),name:name,bgg:bggUrl,img:img,
        complexity:complexity,players:players,duration:duration,
        wish:false,ignored:false,interested:me?[me]:[],explainers:[],suppliers:me?[me]:[],
        erkTime:duration||60,ts:Date.now()};
      existing.push(g);added++;
    });
    eventGames[evId]=existing;
    renderAll();
    status.textContent=added+' Spiele hinzugefügt'+(skipped?' ('+skipped+' bereits vorhanden)':'')+'! Sweet Spots werden geladen…';
    status.style.color='var(--green)';
    // fetch sweet spots for all games with a bgg ID
    var ids=(eventGames[evId]||[]).filter(function(g){return g.bgg&&!g.sweetspot;}).map(function(g){var m=g.bgg.match(/boardgame\/(\d+)/);return m?m[1]:null;}).filter(Boolean);
    if(ids.length)fetchSweetSpots(ids,evId,status);
  }).catch(function(err){
    status.textContent='Fehler: '+err.message;
    status.style.color='var(--red)';
  });
}
function parseBggItem(item,g){
  // sweet spot
  var poll=item.querySelector('poll[name="suggested_numplayers"]');
  if(poll){
    var maxVotes=0;
    poll.querySelectorAll('results').forEach(function(rs){var el=rs.querySelector('result[value="Best"]');if(el)maxVotes=Math.max(maxVotes,parseInt(el.getAttribute('numvotes'))||0);});
    if(maxVotes>0){
      var sweetspot=0;
      poll.querySelectorAll('results').forEach(function(rs){var np=parseInt(rs.getAttribute('numplayers'));if(isNaN(np))return;var el=rs.querySelector('result[value="Best"]');if(el&&(parseInt(el.getAttribute('numvotes'))||0)===maxVotes&&np>sweetspot)sweetspot=np;});
      if(sweetspot>0)g.sweetspot=sweetspot;
    }
  }
  // main image
  var mainImgEl=item.querySelector('items > item > image, item > image');
  if(!mainImgEl)mainImgEl=item.querySelector('image');
  var mainImg=mainImgEl?mainImgEl.textContent.trim():'';
  // German version: image + name
  var deImg='',deName='';
  item.querySelectorAll('versions item').forEach(function(v){
    if(deImg&&deName)return;
    if(v.querySelector('link[type="language"][value="German"]')){
      var vi=v.querySelector('image');if(vi&&!deImg)deImg=vi.textContent.trim();
      var vn=v.querySelector('name[type="primary"]');if(vn&&!deName)deName=vn.getAttribute('value')||'';
    }
  });
  var img=deImg||mainImg;
  if(img&&!g.img)g.img=img.startsWith('//')?'https:'+img:img;
  if(deName&&!g.nameDe)g.nameDe=deName;
}
function fetchSweetSpots(ids,evId,status){
  var BATCH=20;
  var batch=ids.slice(0,BATCH);
  var rest=ids.slice(BATCH);
  fetch('https://boardgamegeek.com/xmlapi2/thing?id='+batch.join(',')+'&versions=1').then(function(r){return r.text();}).then(function(xml){
    var parser=new DOMParser(),doc=parser.parseFromString(xml,'text/xml');
    doc.querySelectorAll('items > item').forEach(function(item){
      var bggId=item.getAttribute('id');
      var bggUrl='https://boardgamegeek.com/boardgame/'+bggId;
      var g=(eventGames[evId]||[]).find(function(x){return x.bgg===bggUrl;});
      if(!g)return;
      parseBggItem(item,g);
    });
    renderAll();
    if(rest.length){fetchSweetSpots(rest,evId,status);}
    else if(status){status.textContent=status.textContent.replace(' Sweet Spots werden geladen…','')+' (Sweet Spots + Cover geladen)';}
  }).catch(function(){});
}
function fetchGameCover(g){
  var m=g.bgg&&g.bgg.match(/boardgame\/(\d+)/);if(!m)return;
  fetch('https://boardgamegeek.com/xmlapi2/thing?id='+m[1]+'&versions=1').then(function(r){return r.text();}).then(function(xml){
    var parser=new DOMParser(),doc=parser.parseFromString(xml,'text/xml');
    var item=doc.querySelector('items > item');if(!item)return;
    parseBggItem(item,g);
    var hdr=document.getElementById('detail-header');
    if(hdr&&currentScreen==='detail'&&g.img)hdr.style.backgroundImage='url(\''+g.img+'\')';
  }).catch(function(){});
}

  if(!evP.length){el.innerHTML='';return;}
  el.innerHTML='<div class="sec-hdr">Umfragen</div>'+evP.map(function(p){

    return'<div class="poll-card"><div style="font-size:14px;font-weight:600;margin-bottom:4px">'+escHtml(p.question)+'</div>'+
      p.options.map(function(opt,i){
        var cnt=Object.values(p.votes).filter(function(v){return v===i;}).length;

        return'<div class="poll-option'+(myV===i?' voted':'')+'" onclick="votePoll(\''+p.id+'\','+i+')">'+
          '<div style="flex:1"><div style="font-size:13px;color:var(--text)">'+escHtml(opt)+'</div>'+

      }).join('')+
      '<div style="font-size:11px;color:var(--muted);margin-top:6px">'+total+' Stimme'+(total!==1?'n':'')+'</div></div>';
  }).join('');
}
function votePoll(id,idx){var p=polls.find(function(x){return x.id===id;});if(!p)return;if(p.votes[currentUserId]===idx)delete p.votes[currentUserId];else p.votes[currentUserId]=idx;renderPolls();}

var SNAP=120,FLY=200,WW=90,touchState={};
function gTX(el){var m=el.style.transform.match(/translateX\(([^)]+)\)/);return m?parseFloat(m[1]):0;}
function swS(e,k,c){if(snappedCardId&&snappedCardId!==k)unsnap(snappedCardId);var t=e.touches[0];touchState[k]={sX:t.clientX,sY:t.clientY,oX:gTX(c),moved:false};c.style.transition='none';}
function swM(e,k,c,wi,we){var ts=touchState[k];if(!ts)return;var t=e.touches[0],dx=t.clientX-ts.sX,dy=t.clientY-ts.sY;if(!ts.moved&&Math.abs(dy)>Math.abs(dx))return;ts.moved=true;e.preventDefault();var tx=ts.oX+dx;c.style.transform='translateX('+tx+'px)';var wh=c.parentElement&&c.parentElement.querySelector('.wagon-hide');if(wh)wh.style.visibility=tx>0?'hidden':'visible';if(tx>0){var iw=Math.min(tx,WW);wi.style.width=iw+'px';wi.style.padding=iw>20?'0 12px':'0';if(tx>WW){var ew=Math.min(tx-WW,WW);we.style.width=ew+'px';we.style.padding=ew>20?'0 12px':'0';we.style.left=iw+'px';}else{we.style.width='0';we.style.padding='0';}}else{wi.style.width='0';wi.style.padding='0';we.style.width='0';we.style.padding='0';}}
function swE(k,c,gid,onR,onL){var ts=touchState[k];if(!ts)return;var tx=gTX(c);c.style.transition='transform .3s ease';if(tx<-FLY){c.style.transform='translateX(-120%)';setTimeout(function(){onL(gid);},300);}else if(tx>FLY){c.style.transform='translateX(120%)';setTimeout(function(){onR(gid,false);},300);}else if(tx>=SNAP){swSnap(k,gid,onR);}else{resetC(k);}delete touchState[k];}
function swSnap(k,gid,onR){snappedCardId=k;var c=document.getElementById('sc-'+k),wi=document.getElementById('wi-'+k),we=document.getElementById('we-'+k);c.style.transition='transform .25s ease';c.style.transform='translateX('+(WW*2)+'px)';wi.style.width=WW+'px';wi.style.padding='0 12px';we.style.width=WW+'px';we.style.padding='0 10px';we.style.left=WW+'px';wi.classList.add('tappable');we.classList.add('tappable');wi.onclick=function(){onR(gid,false);};we.onclick=function(){onR(gid,true);};}
function unsnap(k){if(snappedCardId===k)snappedCardId=null;resetC(k);}
function resetC(k){var c=document.getElementById('sc-'+k),wi=document.getElementById('wi-'+k),we=document.getElementById('we-'+k);if(!c)return;c.style.transition='transform .25s ease';c.style.transform='translateX(0)';var wh=c.parentElement&&c.parentElement.querySelector('.wagon-hide');if(wh)wh.style.visibility='visible';if(wi){wi.style.width='0';wi.style.padding='0';wi.classList.remove('tappable');wi.onclick=null;}if(we){we.style.width='0';we.style.padding='0';we.classList.remove('tappable');we.onclick=null;}if(snappedCardId===k)snappedCardId=null;}
function attachSw(k,gid,onR,onL){var c=document.getElementById('sc-'+k),wi=document.getElementById('wi-'+k),we=document.getElementById('we-'+k);if(!c)return;c.addEventListener('touchstart',function(e){swS(e,k,c);},{passive:true});c.addEventListener('touchmove',function(e){swM(e,k,c,wi,we);},{passive:false});c.addEventListener('touchend',function(){swE(k,c,gid,onR,onL);});}
var toastTimer=null;
function showToast(msg,undoFn){
  var t=document.getElementById('toast'),m=document.getElementById('toast-msg'),u=document.getElementById('toast-undo-btn');
  if(!t)return;
  m.textContent=msg;
  u.onclick=function(){if(toastTimer)clearTimeout(toastTimer);t.classList.remove('show');undoFn();};
  t.classList.add('show');
  if(toastTimer)clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('show');},4000);
}

function getInboxGames(){var me=ME();if(!me)return[];return currentGames().filter(function(g){return!g.wish&&!g.ignored&&g.interested.indexOf(me)<0&&g.explainers.indexOf(me)<0;});}
function updateInboxDot(){var dot=document.getElementById('inbox-dot');if(dot)dot.style.display=getInboxGames().length>0?'block':'none';}
function sortGames(arr){
  var v=(document.getElementById('sort-select')||{value:'newest'}).value;
  arr=arr.slice();
  if(v==='newest')arr.sort(function(a,b){return b.ts-a.ts;});
  else if(v==='az')arr.sort(function(a,b){return a.name.localeCompare(b.name);});
  else if(v==='complexity')arr.sort(function(a,b){return(b.complexity||0)-(a.complexity||0);});
  else if(v==='players')arr.sort(function(a,b){return(parseInt(a.players)||0)-(parseInt(b.players)||0);});
  else if(v==='duration')arr.sort(function(a,b){return(a.duration||0)-(b.duration||0);});
  return arr;
}
function switchListTab(tab){
  currentListTab=tab;
  ['all','mine','shortage','wish'].forEach(function(t){
    var b=document.getElementById('tab-btn-'+t);if(b)b.classList.toggle('active',t===tab);
  });
  renderGameList();
}
function toggleIgnored(){
  showIgnored=!showIgnored;
  var btn=document.getElementById('eye-btn');if(btn)btn.innerHTML=showIgnored?ICO.eye:ICO.eyeoff;
  btn.style.color=showIgnored?'var(--tan)':'var(--muted)';
  renderGameList();
}
function renderGameList(){
  var me=ME(),games=currentGames();
  var allG=games.filter(function(g){return!g.wish;}),wishG=games.filter(function(g){return g.wish;});
  var wd=document.getElementById('wish-dot');if(wd)wd.style.display=wishG.length?'inline-block':'none';
  var filtered;
  if(currentListTab==='wish'){filtered=wishG;}
  else if(currentListTab==='mine'){filtered=allG.filter(function(g){return me&&g.interested.indexOf(me)>=0;});}
  else if(currentListTab==='shortage'){filtered=allG.filter(function(g){return!g.ignored&&(!g.explainers.length||!g.suppliers.length);});}
  else{filtered=allG;}
  if(currentListTab!=='wish'&&!showIgnored)filtered=filtered.filter(function(g){return!g.ignored;});
  filtered=sortGames(filtered);
  var el=document.getElementById('game-list');if(!el)return;
  if(!filtered.length){el.innerHTML='<div style="color:var(--muted);text-align:center;padding:20px;font-size:13px">Keine Spiele</div>';updateInboxDot();return;}
  el.innerHTML=filtered.map(function(g){return renderGameCard(g,false,controlMode==='swipe'?'l-'+g.id:null);}).join('');
  filtered.forEach(function(g){
    var card=document.querySelector('.game-card[data-id="'+g.id+'"]');
    if(card&&!card.dataset.detail){card.dataset.detail='1';card.addEventListener('click',function(e){if(!e.target.closest('button')&&!e.target.closest('a')&&!e.target.closest('select')){openDetail(g.id,'list');}});}
  });
  if(controlMode==='swipe')filtered.forEach(function(g){attachSw('l-'+g.id,g.id,
    function(gid,wE){var x=currentGames().find(function(h){return h.id===gid;});if(!x)return;if(x.ignored){x.ignored=false;renderAll();showToast('Ignorieren aufgehoben',function(){x.ignored=true;renderAll();});return;}toggleInterest(gid);if(wE)addExplainer(gid);showToast(wE?'Erklärer eingetragen':'Interesse angemeldet',function(){toggleInterest(gid);if(wE)removeExplainer(gid);});},
    function(gid){var x=currentGames().find(function(h){return h.id===gid;});var me=ME();if(x&&me&&x.interested.indexOf(me)>=0){toggleInterest(gid);showToast('Interesse ausgetragen',function(){toggleInterest(gid);});}else{ignoreGame(gid);showToast('Ignoriert',function(){var y=currentGames().find(function(h){return h.id===gid;});if(y){y.ignored=false;renderAll();}});}}
  );});
  updateInboxDot();updateEventTitle();
}

function bggThumb(g){return g.img||'';}
function gameName(g){return g.nameDe||g.name;}
function renderGameCard(g,inInbox,swipeKey){
  var me=ME(),amInt=me&&g.interested.indexOf(me)>=0,amExp=me&&g.explainers.indexOf(me)>=0;
  var participants=currentParticipants();
  var noExp=!g.explainers.length&&!g.wish;
  var noSup=!g.suppliers.length&&!g.wish;
  // warning line
  var warnings=[];
  if(noExp)warnings.push('<span style="color:var(--red);font-size:12px;font-weight:600">Kein Erklärer</span>');
  if(noSup)warnings.push('<span style="color:var(--red);font-size:12px;font-weight:600">Kein Lieferant</span>');
  var warnHtml=warnings.length?'<div style="margin-bottom:3px">'+warnings.join('<span style="color:var(--muted);font-size:12px"> · </span>')+'</div>':'';
  // info line
  var infoParts=[];
  if(g.players)infoParts.push(g.players+' Sp.');
  if(g.sweetspot)infoParts.push('Best: '+g.sweetspot);
  if(g.duration)infoParts.push(g.duration+' Min');
  if(g.complexity)infoParts.push('W '+g.complexity);
  var infoLine=infoParts.join(' · ');
  // tags
  var tags='';
  if(g.interested.length){
    var intStyle=(amInt||amExp)?'background:rgba(90,158,111,.2);color:var(--green);':'background:rgba(255,255,255,.06);color:var(--muted);';
    tags+='<span class="tag" style="'+intStyle+'">'+g.interested.length+' Interesse</span>';
  }
  if(g.explainers.length){
    var exN=g.explainers.map(function(pid){var p=participants.find(function(x){return x.id===pid;});return p?(pid===me?'Du erklärst':p.name+' erklärt'):pid;});
    var exStyle=amExp?'background:rgba(212,160,23,.2);color:var(--yellow);':'background:rgba(184,160,130,.12);color:var(--tan);';
    tags+='<span class="tag" style="'+exStyle+'">'+exN[0]+'</span>';
  }
  if(g.ignored)tags+='<span class="tag" style="opacity:.5">Ignoriert</span>';
  if(g.wish)tags+='<span class="tag tan">Wunsch</span>';
  // right ring: interested / sweetspot (fallback: max players)
  var maxP=parseInt((g.players||'').split('-').pop())||4;
  var sweetspot=g.sweetspot||maxP;
  var ratio=g.interested.length/sweetspot;
  var ringHtml=ssSVG(ratio,30);
  // cover image
  var thumb=bggThumb(g);
  var imgHtml=thumb
    ?'<img class="game-card-cover" src="'+thumb+'" onerror="this.style.display=\'none\'" alt="">'
    :'<div class="game-card-cover-ph">'+ic('<rect x="3" y="3" width="18" height="18" rx="3"/>',24)+'</div>';
  // button mode actions
  var btnHtml='';
  if(controlMode==='button'&&me&&!inInbox){
    btnHtml='<div style="display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.07)">';
    if(!amInt) btnHtml+='<button class="btn btn-sm btn-primary" style="flex:1" onclick="event.stopPropagation();toggleInterest(\''+g.id+'\')">Interesse</button>';
    else        btnHtml+='<button class="btn btn-sm btn-ghost" style="flex:1" onclick="event.stopPropagation();toggleInterest(\''+g.id+'\')">Zurückziehen</button>';
    if(!amExp)  btnHtml+='<button class="btn btn-sm" style="flex:1;background:rgba(212,160,23,.15);color:var(--yellow);border:none" onclick="event.stopPropagation();addExplainer(\''+g.id+'\')">Erklären</button>';
    btnHtml+='<button class="btn btn-sm" style="background:rgba(255,255,255,.06);color:var(--muted);border:none" onclick="event.stopPropagation();ignoreGame(\''+g.id+'\')" title="Ignorieren">'+ic('<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>',14)+'</button>';
    btnHtml+='</div>';
  }
  if(controlMode==='button'&&me&&inInbox){
    btnHtml='<div style="display:flex;gap:6px;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,.07)">';
    btnHtml+='<button class="btn btn-sm btn-primary" style="flex:1" onclick="event.stopPropagation();toggleInterest(\''+g.id+'\')">Interesse</button>';
    btnHtml+='<button class="btn btn-sm" style="flex:1;background:rgba(255,255,255,.06);color:var(--muted);border:none" onclick="event.stopPropagation();ignoreGame(\''+g.id+'\')">Ignorieren</button>';
    btnHtml+='</div>';
  }
  var cardInner=
    '<div style="display:flex;align-items:center;gap:12px;padding:12px 14px;">'+
      imgHtml+
      '<div style="flex:1;min-width:0;">'+
        warnHtml+
        '<div style="font-size:16px;font-weight:700;color:var(--text);margin-bottom:2px;line-height:1.2">'+escHtml(gameName(g))+'</div>'+
        (infoLine?'<div style="font-size:13px;color:var(--muted);margin-bottom:5px">'+infoLine+'</div>':'')+
        (tags?'<div class="game-tags">'+tags+'</div>':'')+
        btnHtml+
      '</div>'+
      '<div style="flex-shrink:0;padding-left:4px">'+ringHtml+'</div>'+
    '</div>';
  if(controlMode==='swipe'&&swipeKey){
    return'<div class="swipe-wrap" style="margin-bottom:8px">'+
      '<div class="wagon wagon-hide">'+(amInt?'Austragen':'Ignorieren')+'</div>'+
      '<div class="wagon wagon-interest" id="wi-'+swipeKey+'">'+(g.ignored?'Un-Ignorieren':'Interesse')+'</div>'+
      '<div class="wagon wagon-explain" id="we-'+swipeKey+'">'+(g.ignored?'+ Erklärer':'Erklärer')+'</div>'+
      '<div class="game-card" id="sc-'+swipeKey+'" data-id="'+g.id+'" style="cursor:pointer">'+cardInner+'</div></div>';
  }
  return'<div class="game-card" data-id="'+g.id+'" style="cursor:pointer">'+cardInner+'</div>';
}

function toggleInterest(gid){var me=ME();if(!me)return;var g=currentGames().find(function(x){return x.id===gid;});if(!g)return;var i=g.interested.indexOf(me);if(i>=0)g.interested.splice(i,1);else g.interested.push(me);renderAll();}
function ignoreGame(gid){var g=currentGames().find(function(x){return x.id===gid;});if(g)g.ignored=true;renderAll();}
function addExplainer(gid){var me=ME();if(!me)return;var g=currentGames().find(function(x){return x.id===gid;});if(!g)return;if(g.explainers.indexOf(me)<0)g.explainers.push(me);if(g.interested.indexOf(me)<0)g.interested.push(me);renderAll();}
function removeExplainer(gid){var me=ME();if(!me)return;var g=currentGames().find(function(x){return x.id===gid;});if(!g)return;var i=g.explainers.indexOf(me);if(i>=0)g.explainers.splice(i,1);renderAll();}
function fulfillWish(gid){var me=ME();if(!me)return;var g=currentGames().find(function(x){return x.id===gid;});if(!g)return;g.wish=false;if(g.explainers.indexOf(me)<0)g.explainers.push(me);if(g.suppliers.indexOf(me)<0)g.suppliers.push(me);if(g.interested.indexOf(me)<0)g.interested.push(me);renderAll();}
function showAddGame(){showOverlay('add-game-overlay');}

var detailReturnScreen='list';
function openDetail(gid,fromScreen){
  var g=currentGames().find(function(x){return x.id===gid;});if(!g)return;
  detailReturnScreen=fromScreen||'list';
  var hdr=document.getElementById('detail-header');

    if(g.img){hdr.style.backgroundImage='url(\''+g.img+'\')';}
    else{hdr.style.backgroundImage='none';if(g.bgg)fetchGameCover(g);}
  }
  renderDetail(g);
  showScreen('detail');
}
function goBackFromDetail(){showScreen(detailReturnScreen);}
function pName(pid){var p=currentParticipants().find(function(x){return x.id===pid;});return p?p.name:pid;}
function renderDetail(g){
  var me=ME(),amInt=me&&g.interested.indexOf(me)>=0,amExp=me&&g.explainers.indexOf(me)>=0,amSup=me&&g.suppliers.indexOf(me)>=0;
  var participants=currentParticipants();
  // capacity ring using sweetspot
  var intCount=g.interested.length;
  var maxP=parseInt((g.players||'').split('-').pop())||4;
  var sweetspot=g.sweetspot||maxP;
  var ratio=intCount/sweetspot;
  // status line
  var bns=[];
  if(!g.explainers.length)bns.push('Kein Erklärer');
  if(!g.suppliers.length)bns.push('Kein Lieferant');
  var statusHtml='';
  if(bns.length)statusHtml='<div class="detail-status red">'+bns.join(' · ')+'</div>';
  else if(amExp)statusHtml='<div class="detail-status green">Du erklärst dieses Spiel</div>';
  else if(amSup)statusHtml='<div class="detail-status green">Du bringst dieses Spiel mit</div>';
  // meta
  var metaParts=[];
  if(g.players)metaParts.push(g.players+' Spieler');
  if(g.sweetspot)metaParts.push('Best: '+g.sweetspot);
  if(g.duration)metaParts.push(g.duration+' Min');
  if(g.complexity)metaParts.push('Gewicht '+g.complexity);
  var metaHtml=metaParts.length?'<div class="detail-meta">'+metaParts.join(' · ')+'</div>':'';
  // links
  var linksHtml='';
  if(g.bgg){
    var bggId='';var m=g.bgg.match(/boardgame\/(\d+)/);if(m)bggId=m[1];
    linksHtml='<div class="detail-links">'+
      '<button class="detail-link-btn" onclick="window.open(\''+g.bgg+'\',\'_blank\')">&#127758; BoardGameGeek</button>'+
      (bggId?'<button class="detail-link-btn" onclick="window.open(\'https://bgstats.app/game/'+bggId+'\',\'_blank\')">&#128202; BGStats</button>':'')+
      '</div>';
  }
  // circular + button that opens a native select (shown inline after click)
  function inlinePicker(role,gid){
    var notIn=participants.filter(function(p){return g[role].indexOf(p.id)<0;});
    if(!notIn.length)return'';
    var meObj=notIn.find(function(p){return p.id===me;});
    var rest=notIn.filter(function(p){return p.id!==me;});
    var ordered=meObj?[meObj].concat(rest):rest;
    var selId='rsel-'+role+'-'+gid.replace(/[^a-z0-9]/gi,'');
    var opts=ordered.map(function(p){
      var label=p.id===me?('Ich'+(role==='explainers'?' erkläre':role==='suppliers'?' bringe mit':' bin dabei')):escHtml(p.name);
      return'<option value="'+p.id+'">'+label+'</option>';
    }).join('');
    return'<button class="role-add-circle" onclick="var s=document.getElementById(\''+selId+'\');s.style.display=s.style.display===\'none\'?\'inline-block\':\'none\';if(s.style.display!==\'none\')s.focus()">+</button>'+
      '<select id="'+selId+'" style="display:none;margin-left:4px;background:var(--surface);border:1px solid #555;color:var(--text);border-radius:8px;padding:3px 6px;font-size:12px" onchange="if(this.value){quickAddRoleFor(\''+gid+'\',\''+role+'\',this.value);this.value=\'\';this.style.display=\'none\';}"><option value="">— wählen —</option>'+opts+'</select>';
  }
  // explainer chips
  var ec=g.explainers.map(function(p){
    var cls=p===me?'chip chip-me-exp':'chip chip-exp';
    return'<span class="'+cls+'">'+(p===me?'Du':pName(p))+'<span class="chip-rm" onclick="removeRole(\''+g.id+'\',\'explainers\',\''+p+'\')">&#x2715;</span></span>';
  }).join('');
  // supplier chips
  var sc=g.suppliers.map(function(p){
    var cls=p===me?'chip chip-me':'chip chip-sup';
    return'<span class="'+cls+'">'+(p===me?'Du':pName(p))+'<span class="chip-rm" onclick="removeRole(\''+g.id+'\',\'suppliers\',\''+p+'\')">&#x2715;</span></span>';
  }).join('');
  // interest chips
  var intChips=g.interested.map(function(pid){
    var isMe=pid===me;var isExp=g.explainers.indexOf(pid)>=0;
    var cls=isMe?(isExp?'chip chip-interest-me-exp':'chip chip-interest-me'):'chip chip-interest';

function advanceTrade(id){
  var evId=currentEventId(),tr=(eventTrades[evId]||[]).find(function(x){return x.id===id;});if(!tr)return;
  var me=ME(),iSend=tr.fromId===me,iReceive=tr.toId===me;
  var st=tr.status||'planned';
  if(st==='planned'&&iSend)tr.status='packed';

function addTrade(){
  var itemEl=document.getElementById('new-trade-item'),partnerEl=document.getElementById('new-trade-partner');
  if(!itemEl||!partnerEl)return;
  var item=itemEl.value.trim(),partnerName=partnerEl.value.trim();
  if(!item||!partnerName)return;
  var evId=currentEventId(),me=ME();if(!evId||!me)return;
  var p=currentParticipants().find(function(x){return x.name.toLowerCase()===partnerName.toLowerCase();});
  if(!eventTrades[evId])eventTrades[evId]=[];
  eventTrades[evId].push({id:'tr'+Date.now(),fromId:me,toId:p?p.id:partnerName,item:item,status:'planned'});
  renderPackliste();
}

// ============================================================
// BUFFET
// ============================================================
function renderBuffet(){
  var el=document.getElementById('buffet-list');if(!el)return;
  var ev=currentEvent();
  if(!ev||!ev.hasBuffet){el.innerHTML='<div style="color:var(--muted);text-align:center;padding:30px;font-size:13px">Kein Buffet für dieses Event</div>';return;}
  var items=currentPackItems(),participants=currentParticipants(),games=currentGames();
  var foodItems=items.filter(function(it){return it.type==='food';}),gameItems=games.filter(function(g){return!g.wish&&g.suppliers.length>0;});
  var html='';
  if(foodItems.length){
    html+='<div class="sec-hdr">Essen & Trinken</div>';
    var byP={};foodItems.forEach(function(it){if(!byP[it.participantId])byP[it.participantId]=[];byP[it.participantId].push(it);});
    Object.keys(byP).forEach(function(pid){var p=participants.find(function(x){return x.id===pid;});html+='<div class="card"><div style="font-size:13px;font-weight:600;color:var(--tan);margin-bottom:6px">'+escHtml(p?p.name:pid)+'</div>'+byP[pid].map(function(it){return'<div style="font-size:13px;padding:3px 0;color:'+(it.checked?'var(--muted)':'var(--text)')+'">'+escHtml(it.text)+'</div>';}).join('')+'</div>';});
  }
  if(gameItems.length){
    html+='<div class="sec-hdr">Spiele</div>';
    gameItems.forEach(function(g){var supN=g.suppliers.map(function(pid){var p=participants.find(function(x){return x.id===pid;});return p?p.name:pid;});html+='<div class="card"><div style="font-size:13px;font-weight:600">'+escHtml(g.name)+'</div><div style="font-size:11px;color:var(--muted)">Mitbringer: '+supN.join(', ')+'</div></div>';});
  }
  if(!html)html='<div style="color:var(--muted);text-align:center;padding:30px;font-size:13px">Noch keine Einträge</div>';
  el.innerHTML=html;
}

// ============================================================
// ADMIN
// ============================================================
function renderAdmin(){
  var el=document.getElementById('admin-scroll');if(!el)return;
  if(!adminUnlocked){
    el.innerHTML='<div class="card" style="text-align:center;padding:40px 20px">'+
      '<div style="color:var(--muted);margin-bottom:6px">'+ICO.lock+'</div>'+
      '<div style="color:var(--muted);font-size:13px;margin-bottom:16px">Admin-PIN eingeben</div>'+
      '<input id="admin-pin-input" type="password" placeholder="PIN" style="text-align:center;letter-spacing:4px;font-size:20px;max-width:200px;margin:0 auto;display:block">'+
      '<button class="btn btn-primary" style="margin-top:12px" onclick="checkAdminPin()">Entsperren</button></div>';
    return;
  }
  var ev=currentEvent();
  var tabLabels={event:'Event',banners:'Nachrichten',polls:'Umfragen',vp:'Fiktive Nutzer'};
  el.innerHTML='<div class="admin-tabs">'+Object.keys(tabLabels).map(function(t){return'<button class="admin-tab'+(adminTab===t?' active':'')+'" onclick="setAdminTab(\''+t+'\')">'+tabLabels[t]+'</button>';}).join('')+'</div>'+
    (adminTab==='event'?renderAdminEventTab(ev):adminTab==='banners'?renderAdminBannersTab(ev):adminTab==='polls'?renderAdminPollsTab(ev):renderAdminVpTab(ev));
}
function setAdminTab(tab){adminTab=tab;renderAdmin();}
function renderAdminEventTab(ev){
  if(!ev)return'<div style="color:var(--muted);padding:20px">Kein Event aktiv</div>';
  var evId=ev.id,payments=eventPayments[evId]||{},participants=currentParticipants();
  return'<div class="admin-section"><h3>Buffet</h3><div class="toggle-row"><span style="font-size:13px;color:var(--text)">Buffet aktiviert</span><label class="toggle-switch"><input type="checkbox"'+(ev.hasBuffet?' checked':'')+' onchange="allEvents.find(function(e){return e.id===\''+evId+'\';}).hasBuffet=this.checked"><span class="toggle-slider"></span></label></div></div>'+
    '<div class="admin-section"><h3>Zahlung</h3>'+
    '<label>Betrag</label><input id="pay-amount" value="'+(ev.payAmount||'35€')+'">'+
    '<label>PayPal-Link</label><input id="pay-link" value="'+(ev.paypalLink||'')+'">'+
    '<button class="btn btn-sm btn-primary" style="margin-top:8px" onclick="savePaySettings()">Speichern</button>'+
    '<div class="sec-hdr" style="margin-top:12px">Zahlungsstatus</div>'+
    participants.map(function(p){return'<div class="participant-row"><div class="p-avatar" style="background:'+p.color+'22;color:'+p.color+'">'+p.name.slice(0,2).toUpperCase()+'</div><div style="flex:1;font-size:13px;color:var(--text)">'+escHtml(p.name)+'</div><button class="btn btn-sm '+((payments[p.id])?'btn-primary':'btn-ghost')+'" onclick="togglePayment(\''+evId+'\',\''+p.id+'\')">'+(payments[p.id]?'Bezahlt':'Ausstehend')+'</button></div>';}).join('')+'</div>';
}
function renderAdminBannersTab(ev){
  if(!ev)return'<div style="color:var(--muted);padding:20px">Kein Event aktiv</div>';
  var evId=ev.id,totalU=Object.keys(userMemberships).filter(function(uid){return(userMemberships[uid]||[]).indexOf(evId)>=0;}).length||1;
  var evB=banners.filter(function(b){return b.eventId===evId&&!b.deleted;});
  return'<div class="admin-section"><h3>Neue Nachricht</h3>'+
    '<label>Text</label><textarea id="banner-text" rows="3" placeholder="Nachricht an alle Teilnehmer…"></textarea>'+
    '<label>Anzeigedatum</label>'+
    '<div class="trigger-row"><button class="trigger-opt'+(adminBannerTrigger==='date'?' active':'')+'" onclick="adminBannerTrigger=\'date\';renderAdmin()">Festes Datum</button>'+
    '<button class="trigger-opt'+(adminBannerTrigger==='daysbefore'?' active':'')+'" onclick="adminBannerTrigger=\'daysbefore\';renderAdmin()">Tage vor Event</button></div>'+
    (adminBannerTrigger==='date'?'<input id="banner-date" type="date" style="margin-top:8px">':
    '<div style="display:flex;align-items:center;gap:8px;margin-top:8px"><input id="banner-days" type="number" min="1" placeholder="30" style="width:80px"><span style="color:var(--muted);font-size:13px">Tage vor Anreise</span></div>')+
    '<button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="createBanner()">Erstellen</button></div>'+
    (evB.length?'<div class="admin-section"><h3>Aktive Nachrichten</h3>'+evB.map(function(b){
      var ti=b.triggerType==='date'?'ab '+b.triggerDate:'ab '+b.daysBefore+' Tage vor Event';
      return'<div style="padding:8px 0;border-bottom:1px solid #333"><div style="font-size:13px;color:var(--text);margin-bottom:4px">'+escHtml(b.text)+'</div><div style="font-size:11px;color:var(--muted)">'+ti+' · Gelesen: '+b.readBy.length+'/'+totalU+'</div><button class="btn btn-sm btn-danger" style="margin-top:6px" onclick="deleteBanner(\''+b.id+'\')">Löschen</button></div>';
    }).join('')+'</div>':'');
}
function renderAdminPollsTab(ev){
  if(!ev)return'<div style="color:var(--muted);padding:20px">Kein Event aktiv</div>';
  var evId=ev.id,evP=polls.filter(function(p){return p.eventId===evId;});
  return'<div class="admin-section"><h3>Neue Umfrage</h3>'+
    '<label>Frage</label><input id="poll-question" placeholder="Frage eingeben…">'+
    '<label>Optionen (min. 2)</label>'+[0,1,2,3].map(function(i){return'<input id="poll-opt-'+i+'" placeholder="Option '+(i+1)+(i>1?' (optional)':'')+'" style="margin-bottom:6px">';}).join('')+
    '<button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="createPoll()">Erstellen</button></div>'+
    (evP.length?'<div class="admin-section"><h3>Umfragen</h3>'+evP.map(function(p){
      var tot=Object.keys(p.votes).length;
      return'<div style="padding:8px 0;border-bottom:1px solid #333"><div style="font-size:13px;font-weight:600;color:var(--text)">'+escHtml(p.question)+'</div>'+p.options.map(function(opt,i){var cnt=Object.values(p.votes).filter(function(v){return v===i;}).length;return'<div style="font-size:12px;color:var(--muted);margin-top:3px">'+escHtml(opt)+': '+cnt+' ('+(tot>0?Math.round(cnt/tot*100):0)+'%)</div>';}).join('')+'<div style="font-size:11px;color:var(--muted);margin-top:4px">'+tot+' Stimmen</div><button class="btn btn-sm btn-danger" style="margin-top:6px" onclick="deletePoll(\''+p.id+'\')">Löschen</button></div>';
    }).join('')+'</div>':'');
}
function renderAdminVpTab(ev){
  if(!ev)return'<div style="color:var(--muted);padding:20px">Kein Event aktiv</div>';
  var evId=ev.id,evVps=virtualParticipants.filter(function(v){return v.eventId===evId;});
  return'<div class="admin-section"><h3>Fiktiven Nutzer anlegen</h3>'+
    '<label>Name</label><input id="vp-name" placeholder="Name des Teilnehmers">'+
    '<button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="createVirtualParticipant()">Anlegen</button></div>'+
    (evVps.length?'<div class="admin-section"><h3>Fiktive Nutzer</h3>'+evVps.map(function(vp){
      return'<div class="participant-row"><div class="p-avatar" style="background:#33333377;color:var(--muted)">'+vp.name.slice(0,2).toUpperCase()+'</div><div style="flex:1"><div style="font-size:13px;color:var(--text)">'+escHtml(vp.name)+'</div><div style="font-size:11px;color:var(--muted)">Code: <span class="vp-code">'+vp.code+'</span> · '+(vp.linkedUserId?'Verknüpft':'Frei')+'</div></div></div>';
    }).join('')+'</div>':'');
}
function checkAdminPin(){if(document.getElementById('admin-pin-input').value==='1234'){adminUnlocked=true;renderAdmin();}else alert('Falscher PIN');}
function savePaySettings(){var ev=currentEvent();if(!ev)return;var a=document.getElementById('pay-amount'),l=document.getElementById('pay-link');if(a)ev.payAmount=a.value.trim();if(l)ev.paypalLink=l.value.trim();renderAdmin();}
function togglePayment(evId,pid){if(!eventPayments[evId])eventPayments[evId]={};eventPayments[evId][pid]=!eventPayments[evId][pid];renderAdmin();renderPaypalBanner();}
function createBanner(){var text=document.getElementById('banner-text').value.trim();if(!text){alert('Text erforderlich');return;}var evId=currentEventId();if(!evId)return;var b={id:'bn'+(nextBannerId++),eventId:evId,text:text,readBy:[],deleted:false};if(adminBannerTrigger==='date'){var d=document.getElementById('banner-date').value;if(!d){alert('Datum fehlt');return;}b.triggerType='date';b.triggerDate=d;}else{var days=parseInt(document.getElementById('banner-days').value);if(!days||days<1){alert('Tage fehlen');return;}b.triggerType='daysbefore';b.daysBefore=days;}banners.push(b);renderAdmin();}
function deleteBanner(id){var b=banners.find(function(x){return x.id===id;});if(b)b.deleted=true;renderAdmin();renderBanners();}
function createPoll(){var q=document.getElementById('poll-question').value.trim();if(!q){alert('Frage erforderlich');return;}var opts=[];for(var i=0;i<4;i++){var e=document.getElementById('poll-opt-'+i);if(e&&e.value.trim())opts.push(e.value.trim());}if(opts.length<2){alert('Mindestens 2 Optionen');return;}polls.push({id:'pl'+(nextPollId++),eventId:currentEventId(),question:q,options:opts,votes:{}});renderAdmin();}
function deletePoll(id){polls=polls.filter(function(x){return x.id!==id;});renderAdmin();renderPolls();}
function createVirtualParticipant(){var name=document.getElementById('vp-name').value.trim();if(!name){alert('Name erforderlich');return;}var evId=currentEventId();if(!evId)return;var code='VP-'+name.slice(0,3).toUpperCase()+(Math.floor(Math.random()*900)+100);var id='vp'+(nextVpId++);virtualParticipants.push({id:id,name:name,code:code,eventId:evId,linkedUserId:null});if(!eventParticipants[evId])eventParticipants[evId]=[];eventParticipants[evId].push({id:id,name:name,color:'#666666'});renderAdmin();}

// ============================================================
// UTILS
// ============================================================
function escHtml(str){if(!str)return'';return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ============================================================
// INIT
// ============================================================
function init(){
  initIcons();
  updateAvatars();
  if((userMemberships[currentUserId]||[]).length===0)showJoinScreen();
  else showScreen('list');
}
init();
</script>
</body>
</html>
