<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<title>Dice Days</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:#111;display:flex;justify-content:center;align-items:flex-start;min-height:100vh;font-family:'Segoe UI',sans-serif}
#app{position:relative;width:100%;max-width:430px;min-height:100vh;background:#1a1a1a;overflow:hidden;display:flex;flex-direction:column}
:root{--tan:#B8A082;--surface:#252525;--card:#2e2e2e;--text:#e8e8e8;--muted:#888;--red:#e05555;--green:#5a9e6f;--yellow:#d4a017;--bg:#1a1a1a}
.screen{display:none;flex-direction:column;flex:1;overflow:hidden}
.screen.active{display:flex}
.app-bar{display:flex;align-items:center;padding:12px 16px;background:var(--surface);border-bottom:1px solid #333;gap:8px;flex-shrink:0;position:relative}
.app-bar h1{font-size:17px;font-weight:700;color:var(--tan);flex:1;cursor:pointer;user-select:none}
.app-bar .icon-btn{background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;padding:4px;line-height:1}
.scroll-area{flex:1;overflow-y:auto;padding:12px}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px;position:relative}
.badge{background:var(--red);color:#fff;border-radius:10px;font-size:10px;font-weight:700;padding:2px 6px;min-width:18px;text-align:center;display:inline-block}
.btn{padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:600}
.btn-primary{background:var(--tan);color:#111}
.btn-ghost{background:none;border:1px solid var(--tan);color:var(--tan)}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:5px 10px;font-size:12px}
input,select,textarea{background:#333;border:1px solid #444;color:var(--text);border-radius:8px;padding:8px 10px;font-size:14px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--tan)}
label{color:var(--muted);font-size:12px;display:block;margin-bottom:4px;margin-top:10px}
.bottom-nav{display:flex;background:var(--surface);border-top:1px solid #333;flex-shrink:0}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;padding:8px 2px;background:none;border:none;color:var(--muted);font-size:9px;cursor:pointer;gap:2px;position:relative}
.nav-btn .nav-icon{font-size:20px}
.nav-btn.active{color:var(--tan)}
.nav-dot{position:absolute;top:6px;right:calc(50% - 14px);width:7px;height:7px;background:var(--red);border-radius:50%}
/* Tabs */
.tabs{display:flex;background:var(--surface);border-bottom:1px solid #333;flex-shrink:0}
.tab{flex:1;padding:10px 4px;background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;border-bottom:2px solid transparent;position:relative}
.tab.active{color:var(--tan);border-bottom-color:var(--tan)}
.tab-dot{display:inline-block;width:7px;height:7px;background:var(--red);border-radius:50%;margin-left:3px;vertical-align:middle}
/* Game card */
.game-card{background:var(--card);border-radius:12px;margin-bottom:10px;overflow:hidden;position:relative;touch-action:pan-y;z-index:2}
.game-card-inner{padding:12px}
.game-meta{font-size:11px;color:var(--muted);margin-top:2px}
.game-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:10px;padding:2px 7px;border-radius:10px;background:#333;color:var(--muted)}
.tag.tan{background:rgba(184,160,130,.2);color:var(--tan)}
.tag.green{background:rgba(90,158,111,.2);color:var(--green)}
.tag.yellow{background:rgba(212,160,23,.2);color:var(--yellow)}
/* Zugwaggon swipe */
.swipe-wrap{position:relative;overflow:visible}
.wagon{position:absolute;top:0;height:100%;display:flex;align-items:center;font-size:12px;font-weight:700;border-radius:12px;color:#fff;z-index:0;overflow:hidden;white-space:nowrap}
.wagon-hide{right:0;width:100%;background:var(--red);justify-content:flex-end;padding-right:20px}
.wagon-interest{left:0;width:0;background:var(--green);padding:0;border-radius:12px 0 0 12px}
.wagon-explain{left:0;width:0;background:var(--yellow);padding:0;color:#111;border-radius:12px 0 0 12px}
.wagon.tappable{cursor:pointer;padding:0 14px;z-index:3}
.swipe-wrap .game-card{margin-bottom:0}
.btn-row{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
/* Time bar */
.time-bar-wrap{margin:8px 0}
.time-bar-track{background:#222;border-radius:5px;height:10px;overflow:visible;display:flex;position:relative}
.time-bar-track.overplanned{outline:2px solid var(--red);border-radius:5px}
.time-bar-seg{height:100%;transition:width .3s}
.time-bar-legend{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap}
.tbl-item{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted)}
.tbl-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.overplanned-label{color:var(--red);font-size:11px;font-weight:700;margin-top:2px}
/* Sort bar */
.sort-bar{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--surface);border-bottom:1px solid #333;flex-shrink:0}
.sort-bar select{flex:1;font-size:12px;padding:5px 8px}
.eye-btn{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:2px}
.eye-btn.active{color:var(--tan)}
/* Swipe hint */
.swipe-hint{background:#333;border-radius:8px;padding:10px 12px;font-size:12px;color:var(--muted);text-align:center;margin-bottom:10px}
/* Section header */
.sec-hdr{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin:12px 0 6px}
/* Trade */
.trade-direction{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}
.trade-arrow{color:var(--tan);font-size:16px}
/* PayPal banner */
.paypal-banner{background:linear-gradient(135deg,#003087,#009cde);border-radius:10px;padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.paypal-banner .pp-text{flex:1;color:#fff;font-size:13px}
.paypal-banner .pp-btn{background:#ffc43a;color:#111;border:none;border-radius:6px;padding:6px 12px;font-size:12px;font-weight:700;cursor:pointer}
/* Admin */
.admin-section{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px}
.admin-section h3{font-size:14px;font-weight:700;color:var(--tan);margin-bottom:10px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;margin:8px 0}
.toggle-switch{position:relative;width:44px;height:24px;flex-shrink:0}
.toggle-switch input{opacity:0;width:0;height:0;position:absolute}
.toggle-slider{position:absolute;inset:0;background:#444;border-radius:12px;cursor:pointer;transition:.3s}
.toggle-slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#aaa;border-radius:50%;transition:.3s}
input:checked + .toggle-slider{background:var(--tan)}
input:checked + .toggle-slider:before{transform:translateX(20px);background:#fff}
.participant-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #333}
.participant-row:last-child{border-bottom:none}
.p-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
/* Banner msg */
.msg-banner{background:linear-gradient(135deg,#3a2a10,#4a3a20);border:1px solid var(--tan);border-radius:10px;padding:14px;margin-bottom:10px}
.msg-banner p{font-size:13px;color:var(--text);margin-bottom:10px}
/* Poll */
.poll-card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:10px}
.poll-option{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;border:1px solid #444;margin-top:6px;cursor:pointer;transition:border-color .2s}
.poll-option.voted{border-color:var(--tan);background:rgba(184,160,130,.1)}
.poll-bar{background:var(--tan);height:4px;border-radius:2px;margin-top:4px;transition:width .3s}
/* Join screen */
.join-screen{position:absolute;inset:0;background:var(--bg);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}
.join-screen h2{color:var(--tan);font-size:22px;margin-bottom:6px}
.join-screen p{color:var(--muted);font-size:13px;text-align:center;margin-bottom:20px}
/* User overlay */
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;align-items:flex-start;justify-content:center;padding-top:60px}
.overlay.show{display:flex}
.overlay-box{background:var(--surface);border-radius:14px;padding:20px;width:calc(100% - 32px);max-width:380px}
.overlay-box h3{color:var(--tan);font-size:16px;font-weight:700;margin-bottom:14px}
/* Avatar button */
.avatar-btn{width:32px;height:32px;border-radius:50%;border:2px solid var(--tan);background:var(--card);color:var(--tan);font-size:11px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* Event dropdown */
.event-dropdown{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid #333;border-top:none;z-index:150;display:none}
.event-dropdown.show{display:block}
.event-dd-item{padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:8px;border-bottom:1px solid #333}
.event-dd-item:last-child{border-bottom:none}
.event-dd-item:hover{background:#333}
/* Schedule */
.sched-display{background:var(--card);border-radius:10px;padding:12px;margin-bottom:12px}
.sched-display .sched-row{display:flex;justify-content:space-between;padding:4px 0;font-size:13px;border-bottom:1px solid #333}
.sched-display .sched-row:last-child{border-bottom:none}
.sched-display .sched-label{color:var(--muted)}
/* Packliste */
.pack-item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #333}
.pack-item:last-child{border-bottom:none}
.pack-item input[type=checkbox]{width:18px;height:18px;flex-shrink:0;accent-color:var(--tan)}
.pack-item.done span{text-decoration:line-through;color:var(--muted)}
/* Inline add */
.inline-add{display:flex;gap:8px;margin-top:10px}
.inline-add input{flex:1}
/* VP code */
.vp-code{font-size:11px;background:#333;padding:2px 6px;border-radius:4px;font-family:monospace;letter-spacing:1px;color:var(--tan)}
/* Tabs in admin */
.admin-tabs{display:flex;border-bottom:1px solid #333;margin-bottom:12px}
.admin-tab{flex:1;padding:8px 4px;background:none;border:none;color:var(--muted);font-size:12px;cursor:pointer;border-bottom:2px solid transparent}
.admin-tab.active{color:var(--tan);border-bottom-color:var(--tan)}
/* Banner trigger */
.trigger-row{display:flex;gap:8px;margin-top:8px}
.trigger-opt{flex:1;padding:8px;border-radius:8px;border:1px solid #444;background:none;color:var(--muted);font-size:12px;cursor:pointer;text-align:center}
.trigger-opt.active{border-color:var(--tan);color:var(--tan)}
</style>
</head>
<body>
<div id="app">

<!-- JOIN SCREEN -->
<div class="join-screen" id="join-screen" style="display:none">
  <h2>Willkommen!</h2>
  <p>Gib den Event-Code ein, um einem Event beizutreten.</p>
  <div style="width:100%;max-width:320px">
    <label>Event-Code</label>
    <input id="join-code" placeholder="z.B. KXMP7Q" style="text-transform:uppercase;letter-spacing:2px;font-size:16px;text-align:center">
    <div id="join-pw-wrap" style="display:none">
      <label>Passwort</label>
      <input id="join-pw" type="password" placeholder="Event-Passwort">
    </div>
    <div id="join-err" style="color:var(--red);font-size:12px;margin-top:6px;display:none"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:16px" onclick="submitJoinEvent()">Beitreten</button>
    <button class="btn btn-ghost" style="width:100%;margin-top:8px" onclick="hideJoinScreen()">Abbrechen</button>
  </div>
</div>

<!-- USER OVERLAY -->
<div class="overlay" id="user-overlay">
  <div class="overlay-box">
    <h3>Benutzer wechseln</h3>
    <div id="user-list-ul"></div>
    <div style="margin-top:14px;border-top:1px solid #333;padding-top:12px">
      <div style="font-size:13px;color:var(--muted);margin-bottom:8px">Neuen Benutzer anlegen</div>
      <input id="new-user-name" placeholder="Name">
      <label>Passwort (optional)</label>
      <input id="new-user-pw" type="password" placeholder="Passwort">
      <button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="createNewUser()">Anlegen</button>
    </div>
    <button class="btn btn-ghost" style="width:100%;margin-top:10px" onclick="closeOverlay('user-overlay')">Schließen</button>
  </div>
</div>

<!-- PASSWORD OVERLAY -->
<div class="overlay" id="pw-overlay">
  <div class="overlay-box">
    <h3 id="pw-overlay-title">Passwort</h3>
    <input id="pw-overlay-input" type="password" placeholder="Passwort eingeben">
    <div id="pw-overlay-err" style="color:var(--red);font-size:12px;margin-top:4px;display:none"></div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-primary" style="flex:1" onclick="submitPwOverlay()">OK</button>
      <button class="btn btn-ghost" style="flex:1" onclick="closeOverlay('pw-overlay')">Abbrechen</button>
    </div>
  </div>
</div>

<!-- SCREEN: SPIELE -->
<div class="screen" id="screen-list">
  <div class="app-bar">
    <button class="icon-btn" id="event-title-btn" onclick="toggleEventDropdown()" style="background:none;border:none;color:var(--tan);font-size:17px;font-weight:700;cursor:pointer;flex:1;text-align:left;padding:0">Dice Days</button>
    <button class="icon-btn" onclick="showScreen('admin')">⚙️</button>
    <button class="avatar-btn" id="avatar-list" onclick="openUserOverlay()">DE</button>
    <div class="event-dropdown" id="event-dropdown"></div>
  </div>
  <div id="msg-banner-list" style="padding:8px 12px 0"></div>
  <div class="paypal-banner" id="paypal-banner" style="display:none;margin:8px 12px 0">
    <div class="pp-text">Noch nicht bezahlt. Beitrag: <strong id="pp-amount">35€</strong></div>
    <button class="pp-btn" onclick="openPayPal()">PayPal ↗</button>
  </div>
  <div class="tabs" id="list-tabs">
    <button class="tab active" data-tab="all" onclick="switchListTab('all')">Alle Spiele <span id="tab-all-count" class="badge" style="background:#444">0</span></button>
    <button class="tab" data-tab="wish" onclick="switchListTab('wish')">Wunschliste <span id="tab-wish-count" class="badge" style="background:#444">0</span><span id="wish-dot" class="tab-dot" style="display:none"></span></button>
  </div>
  <div class="sort-bar">
    <select id="sort-select" onchange="renderGameList()">
      <option value="newest">Neueste</option>
      <option value="az">A–Z</option>
      <option value="complexity">Komplexität</option>
      <option value="players">Spielerzahl</option>
      <option value="duration">Spielzeit</option>
    </select>
    <button class="eye-btn active" id="eye-btn" onclick="toggleIgnored()" title="Ignorierte anzeigen/verstecken">👁</button>
  </div>
  <div class="scroll-area" id="game-list-scroll">
    <div id="game-list"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="showAddGame()">+ Spiel hinzufügen</button>
    <div id="polls-area" style="margin-top:16px"></div>
  </div>
</div>

<!-- SCREEN: INBOX -->
<div class="screen" id="screen-inbox">
  <div class="app-bar">
    <h1>Inbox</h1>
    <button class="avatar-btn" id="avatar-inbox" onclick="openUserOverlay()">DE</button>
  </div>
  <div class="scroll-area">
    <div class="time-bar-wrap" id="inbox-timebar"></div>
    <div id="inbox-list"></div>
  </div>
</div>

<!-- SCREEN: MITSPIELEN -->
<div class="screen" id="screen-mit">
  <div class="app-bar">
    <h1>Mitspielen</h1>
    <button class="avatar-btn" id="avatar-mit" onclick="openUserOverlay()">DE</button>
  </div>
  <div class="scroll-area">
    <div class="time-bar-wrap" id="mit-timebar"></div>
    <div id="mit-list"></div>
  </div>
</div>

<!-- SCREEN: ERKLÄREN -->
<div class="screen" id="screen-erk">
  <div class="app-bar">
    <h1>Erklären</h1>
    <button class="avatar-btn" id="avatar-erk" onclick="openUserOverlay()">DE</button>
  </div>
  <div class="scroll-area">
    <div class="time-bar-wrap" id="erk-timebar"></div>
    <div id="erk-list"></div>
  </div>
</div>

<!-- SCREEN: PACKLISTE -->
<div class="screen" id="screen-pack">
  <div class="app-bar">
    <h1>Packliste</h1>
    <button class="avatar-btn" id="avatar-pack" onclick="openUserOverlay()">DE</button>
  </div>
  <div class="scroll-area" id="pack-scroll"></div>
</div>

<!-- SCREEN: BUFFET -->
<div class="screen" id="screen-buffet">
  <div class="app-bar">
    <h1>Mitbringbuffet</h1>
    <button class="avatar-btn" id="avatar-buffet" onclick="openUserOverlay()">DE</button>
  </div>
  <div class="scroll-area" id="buffet-list"></div>
</div>

<!-- SCREEN: ADMIN -->
<div class="screen" id="screen-admin">
  <div class="app-bar">
    <button class="icon-btn" onclick="showScreen('list')" style="font-size:16px">← </button>
    <h1>Admin</h1>
    <button class="avatar-btn" id="avatar-admin" onclick="openUserOverlay()">DE</button>
  </div>
  <div class="scroll-area" id="admin-scroll"></div>
</div>

<!-- ADD GAME OVERLAY -->
<div class="overlay" id="add-game-overlay">
  <div class="overlay-box" style="max-height:80vh;overflow-y:auto">
    <h3>Spiel hinzufügen</h3>
    <label>Spielname *</label>
    <input id="ag-name" placeholder="Spielname">
    <label>BGG-Link</label>
    <input id="ag-bgg" placeholder="https://boardgamegeek.com/boardgame/...">
    <label>Komplexität (1–5)</label>
    <input id="ag-complexity" type="number" min="1" max="5" step="0.1" placeholder="3.2">
    <label>Spieleranzahl</label>
    <input id="ag-players" placeholder="2–4">
    <label>Spielzeit (min)</label>
    <input id="ag-duration" type="number" placeholder="60">
    <label>Als Wunsch eintragen</label>
    <select id="ag-wish">
      <option value="0">Nein – ich bringe es mit</option>
      <option value="1">Ja – ich wünsche mir das Spiel</option>
    </select>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="btn btn-primary" style="flex:1" onclick="addGame()">Hinzufügen</button>
      <button class="btn btn-ghost" style="flex:1" onclick="closeOverlay('add-game-overlay')">Abbrechen</button>
    </div>
  </div>
</div>

<!-- BOTTOM NAV -->
<div class="bottom-nav" id="bottom-nav">
  <button class="nav-btn active" id="nav-list" onclick="showScreen('list')">
    <span class="nav-icon">🎲</span>Spiele
  </button>
  <button class="nav-btn" id="nav-inbox" onclick="showScreen('inbox')">
    <span class="nav-icon">📬</span>Inbox
    <span class="nav-dot" id="inbox-dot" style="display:none"></span>
  </button>
  <button class="nav-btn" id="nav-mit" onclick="showScreen('mit')">
    <span class="nav-icon">🃏</span>Mitspielen
  </button>
  <button class="nav-btn" id="nav-erk" onclick="showScreen('erk')">
    <span class="nav-icon">📖</span>Erklären
  </button>
  <button class="nav-btn" id="nav-pack" onclick="showScreen('pack')">
    <span class="nav-icon">🎒</span>Packliste
  </button>
  <button class="nav-btn" id="nav-buffet" onclick="showScreen('buffet')">
    <span class="nav-icon">🍽️</span>Buffet
  </button>
</div>

</div>

// ============================================================
// TIME BAR
// ============================================================
function getScheduleMinutes() {
  var ev = currentEvent(), sched = mySchedule();
  if (!ev) return {total:0, sleep:0, available:0};
  var src = (sched && sched.saved) ? sched : ev;
  function toMin(d, t) { return new Date(d+'T'+t).getTime()/60000; }
  var total = Math.max(0, toMin(src.departureDate||ev.departureDate, src.departureTime||ev.departureTime) - toMin(src.arrivalDate||ev.arrivalDate, src.arrivalTime||ev.arrivalTime));
  var sleep = 0;
  if (src.sleepStart && src.sleepEnd) {
    var ss = parseInt(src.sleepStart)*60+parseInt(src.sleepStart.split(':')[1]);
    var se = parseInt(src.sleepEnd)*60+parseInt(src.sleepEnd.split(':')[1]);
    if (se <= ss) se += 1440;
    sleep = Math.min((se-ss)*Math.max(1,Math.floor(total/1440)), total*0.5);
  }
  return {total:total, sleep:sleep, available:Math.max(0,total-sleep)};
}

function getTimePlan() {
  var me = ME(), games = currentGames();
  var erkTime=0, mitTime=0, erkGames=[], mitGames=[];
  games.forEach(function(g) {
    if (g.wish||g.ignored) return;
    var amExp = me && g.explainers.indexOf(me)>=0;
    var amInt = me && g.interested.indexOf(me)>=0;
    if (amExp) { erkTime+=(g.erkTime||g.duration||0); erkGames.push(g); }
    else if (amInt) { mitTime+=(g.duration||0); mitGames.push(g); }
  });
  return {erkTime:erkTime, mitTime:mitTime, erkGames:erkGames, mitGames:mitGames};
}

function renderUnifiedTimeBar(containerId) {
  var el = document.getElementById(containerId);
  if (!el) return;
  var sched = getScheduleMinutes(), plan = getTimePlan();
  if (sched.total === 0) { el.innerHTML=''; return; }
  var sleepMin=sched.sleep, totalMin=sched.total;
  var erkMin=plan.erkTime, mitMin=plan.mitTime;
  var usedMin=erkMin+mitMin+sleepMin;
  var over=usedMin>totalMin;
  var erkPct=Math.min(erkMin/totalMin*100,100);
  var mitPct=Math.min(mitMin/totalMin*100,Math.max(0,100-erkPct));
  var sleepPct=Math.min(sleepMin/totalMin*100,Math.max(0,100-erkPct-mitPct));
  function fmtH(m){var h=Math.floor(m/60),mn=Math.round(m%60);return h>0?h+'h'+(mn>0?mn+'m':''):mn+'m';}
  el.innerHTML='<div style="font-size:11px;color:var(--muted);margin-bottom:4px">Zeitplanung</div>'+
    '<div class="time-bar-track'+(over?' overplanned':'')+'">'+
      '<div class="time-bar-seg" style="width:'+erkPct+'%;background:var(--yellow)"></div>'+
      '<div class="time-bar-seg" style="width:'+mitPct+'%;background:var(--tan)"></div>'+
      '<div class="time-bar-seg" style="width:'+sleepPct+'%;background:#3a3060"></div>'+
    '</div>'+
    (over?'<div class="overplanned-label">⚠ +'+fmtH(usedMin-totalMin)+' überplant!</div>':'')+
    '<div class="time-bar-legend">'+
      '<span class="tbl-item"><span class="tbl-dot" style="background:var(--yellow)"></span>Erklären '+fmtH(erkMin)+'</span>'+
      '<span class="tbl-item"><span class="tbl-dot" style="background:var(--tan)"></span>Mitspielen '+fmtH(mitMin)+'</span>'+
      '<span class="tbl-item"><span class="tbl-dot" style="background:#3a3060;border:1px solid #555"></span>Schlaf '+fmtH(sleepMin)+'</span>'+
      '<span class="tbl-item" style="color:var(--muted)">/ '+fmtH(totalMin)+' gesamt</span>'+
    '</div>';
}

// ============================================================
// SWIPE ENGINE (Zugwaggon pattern)
// ============================================================
var SNAP=70,FLY=160,WW=90;
var touchState={};
function gTX(el){var m=el.style.transform.match(/translateX\(([^)]+)\)/);return m?parseFloat(m[1]):0;}
function swS(e,k,c){if(snappedCardId&&snappedCardId!==k)unsnap(snappedCardId);var t=e.touches[0];touchState[k]={sX:t.clientX,sY:t.clientY,oX:gTX(c),moved:false};c.style.transition='none';}
function swM(e,k,c,wi,we){var ts=touchState[k];if(!ts)return;var t=e.touches[0],dx=t.clientX-ts.sX,dy=t.clientY-ts.sY;if(!ts.moved&&Math.abs(dy)>Math.abs(dx))return;ts.moved=true;e.preventDefault();var tx=ts.oX+dx;c.style.transform='translateX('+tx+'px)';if(tx>0){var iw=Math.min(tx,WW);wi.style.width=iw+'px';wi.style.padding=iw>20?'0 12px':'0';if(tx>WW){var ew=Math.min(tx-WW,WW);we.style.width=ew+'px';we.style.padding=ew>20?'0 12px':'0';we.style.left=iw+'px';}else{we.style.width='0';we.style.padding='0';}}else{wi.style.width='0';wi.style.padding='0';we.style.width='0';we.style.padding='0';}}
function swE(k,c,gid,onRight,onLeft){var ts=touchState[k];if(!ts)return;var tx=gTX(c);c.style.transition='transform .3s ease';if(tx<-FLY){c.style.transform='translateX(-120%)';setTimeout(function(){onLeft(gid);},300);}else if(tx>FLY){c.style.transform='translateX(120%)';setTimeout(function(){onRight(gid,false);},300);}else if(tx>=SNAP){swSnap(k,gid,onRight);}else{resetC(k);}delete touchState[k];}
function swSnap(k,gid,onRight){snappedCardId=k;var c=document.getElementById('sc-'+k),wi=document.getElementById('wi-'+k),we=document.getElementById('we-'+k);c.style.transition='transform .25s ease';c.style.transform='translateX('+(WW*2)+'px)';wi.style.width=WW+'px';wi.style.padding='0 12px';we.style.width=WW+'px';we.style.padding='0 10px';we.style.left=WW+'px';wi.classList.add('tappable');we.classList.add('tappable');wi.onclick=function(){onRight(gid,false);};we.onclick=function(){onRight(gid,true);};}
function unsnap(k){if(snappedCardId===k)snappedCardId=null;resetC(k);}
function resetC(k){var c=document.getElementById('sc-'+k),wi=document.getElementById('wi-'+k),we=document.getElementById('we-'+k);if(!c)return;c.style.transition='transform .25s ease';c.style.transform='translateX(0)';if(wi){wi.style.width='0';wi.style.padding='0';wi.classList.remove('tappable');wi.onclick=null;}if(we){we.style.width='0';we.style.padding='0';we.classList.remove('tappable');we.onclick=null;}if(snappedCardId===k)snappedCardId=null;}
function attachSw(k,gid,onR,onL){var c=document.getElementById('sc-'+k),wi=document.getElementById('wi-'+k),we=document.getElementById('we-'+k);if(!c)return;c.addEventListener('touchstart',function(e){swS(e,k,c);},{passive:true});c.addEventListener('touchmove',function(e){swM(e,k,c,wi,we);},{passive:false});c.addEventListener('touchend',function(){swE(k,c,gid,onR,onL);});}

function getInboxGames() {
  var me=ME();
  if (!me) return [];
  return currentGames().filter(function(g){return !g.wish&&!g.ignored&&g.interested.indexOf(me)<0&&g.explainers.indexOf(me)<0;});
}

function updateInboxDot() {
  var dot=document.getElementById('inbox-dot');
  if (dot) dot.style.display=getInboxGames().length>0?'block':'none';
}

function sortGames(games) {
  var v=(document.getElementById('sort-select')||{value:'newest'}).value;
  var arr=games.slice();
  if (v==='newest') arr.sort(function(a,b){return b.ts-a.ts;});
  else if (v==='az') arr.sort(function(a,b){return a.name.localeCompare(b.name);});
  else if (v==='complexity') arr.sort(function(a,b){return (b.complexity||0)-(a.complexity||0);});
  else if (v==='players') arr.sort(function(a,b){return (parseInt(a.players)||0)-(parseInt(b.players)||0);});
  else if (v==='duration') arr.sort(function(a,b){return (a.duration||0)-(b.duration||0);});
  return arr;
}

function switchListTab(tab) {
  currentListTab=tab;
  document.querySelectorAll('#list-tabs .tab').forEach(function(t){t.classList.remove('active');});
  var el=document.querySelector('#list-tabs [data-tab="'+tab+'"]');
  if (el) el.classList.add('active');
  renderGameList();
}

function toggleIgnored() {
  showIgnored=!showIgnored;
  var btn=document.getElementById('eye-btn');
  if (btn){btn.classList.toggle('active',showIgnored);btn.style.opacity=showIgnored?'1':'0.5';}
  renderGameList();
}

function renderGameList() {
  var me=ME(), games=currentGames();
  var allG=games.filter(function(g){return !g.wish;}), wishG=games.filter(function(g){return g.wish;});
  var cnt=document.getElementById('tab-all-count');if(cnt)cnt.textContent=allG.length;
  var wcnt=document.getElementById('tab-wish-count');if(wcnt)wcnt.textContent=wishG.length;
  var myGames=games.filter(function(g){return !g.wish&&me&&g.suppliers.indexOf(me)>=0;});
  var myNames=myGames.map(function(g){return g.name.toLowerCase();});
  var wd=document.getElementById('wish-dot');
  if (wd) wd.style.display=wishG.some(function(g){return myNames.indexOf(g.name.toLowerCase())>=0;})?'inline-block':'none';

  var filtered=currentListTab==='wish'?wishG:allG;
  if (currentListTab!=='wish'&&!showIgnored) filtered=filtered.filter(function(g){return !g.ignored;});
  filtered=sortGames(filtered);

  var el=document.getElementById('game-list');
  if (!el) return;
  if (!filtered.length){el.innerHTML='<div style="color:var(--muted);text-align:center;padding:20px;font-size:13px">Keine Spiele</div>';updateInboxDot();return;}

  el.innerHTML=filtered.map(function(g){
    var key=controlMode==='swipe'?'l-'+g.id:null;
    return renderGameCard(g,false,key);
  }).join('');

  if (controlMode==='swipe') {
    filtered.forEach(function(g){
      attachSw('l-'+g.id, g.id,
        function(gid,withExp){toggleInterest(gid);if(withExp)addExplainer(gid);},
        ignoreGame);
    });
  }
  updateInboxDot();
  updateEventTitle();
}

function renderGameCard(g, inInbox, swipeKey) {
  var me=ME();
  var amInterested=me&&g.interested.indexOf(me)>=0;
  var amExplainer=me&&g.explainers.indexOf(me)>=0;
  var participants=currentParticipants();

  var tags='';
  if (g.complexity) tags+='<span class="tag">⚡ '+g.complexity+'</span>';
  if (g.players) tags+='<span class="tag">👥 '+g.players+'</span>';
  if (g.duration) tags+='<span class="tag">⏱ '+g.duration+'min</span>';
  if (amInterested) tags+='<span class="tag tan">★ Interesse</span>';
  if (amExplainer) tags+='<span class="tag yellow">📖 Erklärer</span>';
  if (g.ignored) tags+='<span class="tag" style="opacity:.5">👁‍🗨 Ignoriert</span>';

  var nameLink=g.bgg?'<a href="'+g.bgg+'" target="_blank" style="color:var(--text);text-decoration:none">'+escHtml(g.name)+'</a>':escHtml(g.name);

  var btnHtml='';
  if (controlMode==='button') {
    btnHtml='<div class="btn-row">';
    btnHtml+='<button class="btn btn-sm '+(amInterested?'btn-primary':'btn-ghost')+'" onclick="toggleInterest(\''+g.id+'\')">'+(amInterested?'★ Interesse':'☆ Interesse')+'</button>';
    if (inInbox) btnHtml+='<button class="btn btn-sm btn-ghost" onclick="ignoreGame(\''+g.id+'\')">Ausblenden</button>';
    if (!amExplainer&&me) btnHtml+='<button class="btn btn-sm btn-ghost" onclick="addExplainer(\''+g.id+'\')">📖 Ich erkläre</button>';
    if (amExplainer) btnHtml+='<button class="btn btn-sm btn-ghost" onclick="removeExplainer(\''+g.id+'\')">📖 Nicht mehr</button>';
    if (g.wish&&me&&!g.ignored) btnHtml+='<button class="btn btn-sm btn-primary" onclick="fulfillWish(\''+g.id+'\')">✓ Wunsch erfüllen</button>';
    btnHtml+='</div>';
  } else {
    if (g.wish&&me) btnHtml='<div class="btn-row"><button class="btn btn-sm btn-primary" onclick="fulfillWish(\''+g.id+'\')">✓ Wunsch erfüllen</button></div>';
  }

  var infoHtml='';
  if (g.explainers.length>0) {
    var exNames=g.explainers.map(function(pid){var p=participants.find(function(x){return x.id===pid;});return p?p.name:pid;});
    infoHtml+='<div style="font-size:11px;color:var(--yellow);margin-top:4px">📖 '+exNames.join(', ')+'</div>';
  } else if (me&&!g.wish) {
    infoHtml+='<div style="font-size:11px;color:var(--muted);margin-top:4px">📖 Kein Erklärer</div>';
  }
  if (g.suppliers.length>0) {
    var supNames=g.suppliers.map(function(pid){var p=participants.find(function(x){return x.id===pid;});return p?p.name:pid;});
    infoHtml+='<div style="font-size:11px;color:var(--muted);margin-top:2px">🎒 '+supNames.join(', ')+'</div>';
  }

  var cardInner='<div class="game-card-inner">'+
    '<div style="font-size:14px;font-weight:600">'+nameLink+'</div>'+
    '<div class="game-tags">'+tags+'</div>'+
    infoHtml+btnHtml+
  '</div>';

  if (controlMode==='swipe'&&swipeKey) {
    return '<div class="swipe-wrap" style="margin-bottom:10px">'+
      '<div class="wagon wagon-hide">Ausblenden</div>'+
      '<div class="wagon wagon-interest" id="wi-'+swipeKey+'">★ Interesse</div>'+
      '<div class="wagon wagon-explain" id="we-'+swipeKey+'">📖 Erklärbedarf</div>'+
      '<div class="game-card" id="sc-'+swipeKey+'">'+cardInner+'</div>'+
    '</div>';
  }
  return '<div class="game-card" data-id="'+g.id+'">'+cardInner+'</div>';
}

// ============================================================
// GAME ACTIONS
// ============================================================
function toggleInterest(gid){
  var me=ME();if(!me)return;
  var g=currentGames().find(function(x){return x.id===gid;});if(!g)return;
  var idx=g.interested.indexOf(me);
  if(idx>=0)g.interested.splice(idx,1);else g.interested.push(me);
  renderAll();
}
function ignoreGame(gid){
  var g=currentGames().find(function(x){return x.id===gid;});
  if(g)g.ignored=true;
  renderAll();
}
function addExplainer(gid){
  var me=ME();if(!me)return;
  var g=currentGames().find(function(x){return x.id===gid;});if(!g)return;
  if(g.explainers.indexOf(me)<0)g.explainers.push(me);
  if(g.interested.indexOf(me)<0)g.interested.push(me);
  renderAll();
}
function removeExplainer(gid){
  var me=ME();if(!me)return;
  var g=currentGames().find(function(x){return x.id===gid;});if(!g)return;
  var idx=g.explainers.indexOf(me);if(idx>=0)g.explainers.splice(idx,1);
  renderAll();
}
function fulfillWish(gid){
  var me=ME();if(!me)return;
  var g=currentGames().find(function(x){return x.id===gid;});if(!g)return;
  g.wish=false;
  if(g.explainers.indexOf(me)<0)g.explainers.push(me);
  if(g.suppliers.indexOf(me)<0)g.suppliers.push(me);
  if(g.interested.indexOf(me)<0)g.interested.push(me);
  renderAll();
}
function showAddGame(){showOverlay('add-game-overlay');}
function addGame(){
  var name=document.getElementById('ag-name').value.trim();
  if(!name){alert('Name erforderlich');return;}
  var me=ME(),evId=currentEventId();if(!evId)return;
  var isWish=document.getElementById('ag-wish').value==='1';
  var g={id:'g'+Date.now(),name:name,bgg:document.getElementById('ag-bgg').value.trim(),
    complexity:parseFloat(document.getElementById('ag-complexity').value)||null,
    players:document.getElementById('ag-players').value.trim(),
    duration:parseInt(document.getElementById('ag-duration').value)||null,
    wish:isWish,ignored:false,
    interested:isWish?[]:(me?[me]:[]),
    explainers:[],suppliers:isWish?[]:(me?[me]:[]),
    erkTime:parseInt(document.getElementById('ag-duration').value)||60,ts:Date.now()};
  if(!eventGames[evId])eventGames[evId]=[];
  eventGames[evId].push(g);
  closeOverlay('add-game-overlay');
  renderAll();
}

// INBOX
// ============================================================
function renderInbox(){
  var el=document.getElementById('inbox-list');if(!el)return;
  var games=getInboxGames();
  if(!games.length){el.innerHTML='<div style="color:var(--muted);text-align:center;padding:30px;font-size:13px">Keine neuen Spiele in der Inbox</div>';return;}
  var hint=controlMode==='swipe'?'<div class="swipe-hint">→ Rechts: Interesse | ← Links: Ignorieren</div>':'';
  el.innerHTML=hint+games.map(function(g){
    var key=controlMode==='swipe'?'i-'+g.id:null;
    return renderGameCard(g,true,key);
  }).join('');
  if(controlMode==='swipe'){
    games.forEach(function(g){
      attachSw('i-'+g.id,g.id,
        function(gid,withExp){toggleInterest(gid);if(withExp)addExplainer(gid);},
        ignoreGame);
    });
  }
}

// ============================================================
// PACKLISTE
// ============================================================
function renderPackliste(){
  var el=document.getElementById('pack-scroll');if(!el)return;
  var ev=currentEvent(),me=ME(),items=currentPackItems(),trades=currentTrades(),participants=currentParticipants();
  var html='';
  html+='<div class="sec-hdr">Meine Anreise</div>'+renderScheduleSection();
  if(ev&&ev.genericPacklist&&ev.genericPacklist.length){
    html+='<div class="sec-hdr">Allgemeine Packliste</div><div class="card">';
    ev.genericPacklist.forEach(function(item,i){html+='<div class="pack-item" id="gpack-'+i+'"><input type="checkbox" onchange="toggleGenericPack('+i+',this)"><span>'+escHtml(item)+'</span></div>';});
    html+='</div>';
  }
  var myItems=items.filter(function(it){return it.participantId===me;});
  html+='<div class="sec-hdr">Meine Mitbringsel</div><div class="card">';
  if(!myItems.length)html+='<div style="color:var(--muted);font-size:13px">Noch nichts eingetragen</div>';
  myItems.forEach(function(it){
    html+='<div class="pack-item'+(it.checked?' done':'')+'" id="pki-'+it.id+'">'+
      '<input type="checkbox"'+(it.checked?' checked':'')+' onchange="togglePackItem(\''+it.id+'\',this)">'+
      '<span style="flex:1">'+escHtml(it.text)+'</span>'+
      '<button style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px" onclick="removePackItem(\''+it.id+'\')">✕</button></div>';
  });
  html+='<div class="inline-add"><input id="new-pack-item" placeholder="Hinzufügen..."><button class="btn btn-sm btn-primary" onclick="addPackItem()">+</button></div></div>';
  if(trades.length){
    html+='<div class="sec-hdr">Handelsbörse</div>';
    trades.forEach(function(tr){
      var fromP=participants.find(function(p){return p.id===tr.fromId;}),toP=participants.find(function(p){return p.id===tr.toId;});
      var fromName=fromP?fromP.name:tr.fromId,toName=toP?toP.name:tr.toId;
      var iSend=tr.fromId===me,iReceive=tr.toId===me;
      html+='<div class="card"><div style="font-size:13px;font-weight:600;margin-bottom:6px">'+escHtml(tr.item)+'</div>'+
        '<div class="trade-direction"><span style="color:'+(fromP?fromP.color:'var(--muted)')+'">'+fromName+'</span><span class="trade-arrow">→</span><span style="color:'+(toP?toP.color:'var(--muted)')+'">'+toName+'</span></div>';
      if(iSend){
        if(tr.status==='offered')html+='<button class="btn btn-sm btn-primary" onclick="advanceTrade(\''+tr.id+'\')">Eingepackt ✓</button>';
        else if(tr.status==='packed')html+='<div style="font-size:12px;color:var(--green)">✓ Eingepackt</div><button class="btn btn-sm btn-primary" onclick="advanceTrade(\''+tr.id+'\')">Übergeben ✓</button>';
        else html+='<div style="font-size:12px;color:var(--green)">✓ Abgeschlossen</div>';
      }else if(iReceive){
        html+=(tr.fromPacked?'<span style="color:var(--green);font-size:12px">✓ Sender hat eingepackt</span>':'<span style="color:var(--muted);font-size:12px">Noch nicht eingepackt</span>');
        if(tr.status==='delivered')html+=' <button class="btn btn-sm btn-primary" onclick="advanceTrade(\''+tr.id+'\')">Erhalten ✓</button>';
      }
      html+='<button class="btn btn-sm btn-ghost" style="margin-top:6px;display:block" onclick="editTradePartner(\''+tr.id+'\')">Partner bearbeiten</button></div>';
    });
  }
  el.innerHTML=html;
}

function renderScheduleSection(){
  var ev=currentEvent(),sched=mySchedule();
  if(!ev)return '<div style="color:var(--muted);font-size:13px">Kein Event aktiv</div>';
  if(sched&&sched.saved){
    return '<div class="sched-display">'+
      '<div class="sched-row"><span class="sched-label">Anreise</span><span>'+sched.arrivalDate+' '+sched.arrivalTime+'</span></div>'+
      '<div class="sched-row"><span class="sched-label">Abreise</span><span>'+sched.departureDate+' '+sched.departureTime+'</span></div>'+
      '<div class="sched-row"><span class="sched-label">Schlaf</span><span>'+sched.sleepStart+' – '+sched.sleepEnd+' Uhr</span></div>'+
      '<button class="btn btn-sm btn-ghost" style="margin-top:8px" onclick="editSchedule()">Bearbeiten</button></div>';
  }
  var arr=sched?sched.arrivalDate:ev.arrivalDate,arrt=sched?sched.arrivalTime:ev.arrivalTime;
  var dep=sched?sched.departureDate:ev.departureDate,dept=sched?sched.departureTime:ev.departureTime;
  var ss=sched?(sched.sleepStart||'02:00'):'02:00',se=sched?(sched.sleepEnd||'09:00'):'09:00';
  return '<div class="card">'+
    '<label>Anreisedatum</label><input id="sched-arr-date" type="date" value="'+arr+'">'+
    '<label>Anreisezeit</label><input id="sched-arr-time" type="time" value="'+arrt+'">'+
    '<label>Abreisedatum</label><input id="sched-dep-date" type="date" value="'+dep+'">'+
    '<label>Abreisezeit</label><input id="sched-dep-time" type="time" value="'+dept+'">'+
    '<label>Schlaf von</label><input id="sched-sleep-start" type="time" value="'+ss+'">'+
    '<label>Schlaf bis</label><input id="sched-sleep-end" type="time" value="'+se+'">'+
    '<button class="btn btn-primary" style="width:100%;margin-top:12px" onclick="saveSchedule()">Speichern</button></div>';
}

function saveSchedule(){
  var evId=currentEventId();if(!evId)return;
  if(!userSchedules[currentUserId])userSchedules[currentUserId]={};
  userSchedules[currentUserId][evId]={
    arrivalDate:document.getElementById('sched-arr-date').value,
    arrivalTime:document.getElementById('sched-arr-time').value,
    departureDate:document.getElementById('sched-dep-date').value,
    departureTime:document.getElementById('sched-dep-time').value,
    sleepStart:document.getElementById('sched-sleep-start').value,
    sleepEnd:document.getElementById('sched-sleep-end').value,saved:true};
  renderPackliste();
  renderUnifiedTimeBar('inbox-timebar');renderUnifiedTimeBar('mit-timebar');renderUnifiedTimeBar('erk-timebar');
}
function editSchedule(){
  var evId=currentEventId();if(!evId||!userSchedules[currentUserId]||!userSchedules[currentUserId][evId])return;
  userSchedules[currentUserId][evId].saved=false;renderPackliste();
}
function togglePackItem(id,cb){
  var evId=currentEventId();
  var item=(eventPackItems[evId]||[]).find(function(x){return x.id===id;});
  if(item)item.checked=cb.checked;
  var row=document.getElementById('pki-'+id);
  if(row)row.className='pack-item'+(cb.checked?' done':'');
}
function toggleGenericPack(i,cb){var row=document.getElementById('gpack-'+i);if(row)row.className='pack-item'+(cb.checked?' done':'');}
function addPackItem(){
  var inp=document.getElementById('new-pack-item');if(!inp)return;
  var text=inp.value.trim();if(!text)return;
  var evId=currentEventId(),me=ME();if(!evId||!me)return;
  if(!eventPackItems[evId])eventPackItems[evId]=[];
  eventPackItems[evId].push({id:'pk'+Date.now(),participantId:me,text:text,type:'personal',checked:false});
  inp.value='';renderPackliste();
}
function removePackItem(id){
  var evId=currentEventId();if(!eventPackItems[evId])return;
  eventPackItems[evId]=eventPackItems[evId].filter(function(x){return x.id!==id;});
  renderPackliste();
}
function advanceTrade(id){
  var evId=currentEventId(),trades=eventTrades[evId]||[],tr=trades.find(function(x){return x.id===id;});if(!tr)return;
  if(tr.status==='offered'){tr.status='packed';tr.fromPacked=true;}
  else if(tr.status==='packed'){tr.status='delivered';}
  else if(tr.status==='delivered'){tr.status='done';tr.toPacked=true;}
  renderPackliste();
}
function editTradePartner(id){
  var newP=prompt('Neuer Handelspartner (Name):');if(!newP)return;
  var evId=currentEventId(),trades=eventTrades[evId]||[],tr=trades.find(function(x){return x.id===id;});if(!tr)return;
  var me=ME(),participants=currentParticipants();
  var found=participants.find(function(p){return p.name.toLowerCase()===newP.toLowerCase();});
  if(tr.fromId===me)tr.toId=found?found.id:newP;else tr.fromId=found?found.id:newP;
  renderPackliste();
}

      html+='</div>';
    });
  }
  if(gameItems.length){
    html+='<div class="sec-hdr">Spiele (Mitbringer)</div>';
    gameItems.forEach(function(g){
      var supNames=g.suppliers.map(function(pid){var p=participants.find(function(x){return x.id===pid;});return p?p.name:pid;});
      html+='<div class="card"><div style="font-size:13px;font-weight:600">'+escHtml(g.name)+'</div><div style="font-size:11px;color:var(--muted)">🎒 '+supNames.join(', ')+'</div></div>';

  }
  if(!html)html='<div style="color:var(--muted);text-align:center;padding:30px;font-size:13px">Noch keine Einträge</div>';
  el.innerHTML=html;
}

  if(!adminUnlocked){
    el.innerHTML='<div class="card" style="text-align:center;padding:30px">'+
      '<div style="font-size:40px;margin-bottom:10px">🔒</div>'+
      '<div style="color:var(--muted);margin-bottom:16px">Admin-PIN eingeben</div>'+
      '<input id="admin-pin-input" type="password" placeholder="PIN" style="text-align:center;letter-spacing:4px;font-size:20px;max-width:200px;margin:0 auto;display:block">'+
      '<button class="btn btn-primary" style="margin-top:12px" onclick="checkAdminPin()">Entsperren</button></div>';
    return;
  }
  var ev=currentEvent();
  el.innerHTML='<div class="admin-tabs">'+
    ['event','banners','polls','vp'].map(function(t){
      var labels={event:'Event',banners:'Nachrichten',polls:'Umfragen',vp:'Fiktive Nutzer'};
      return '<button class="admin-tab'+(adminTab===t?' active':'')+'" onclick="setAdminTab(\''+t+'\')">'+labels[t]+'</button>';
    }).join('')+'</div>'+
    (adminTab==='event'?renderAdminEventTab(ev):adminTab==='banners'?renderAdminBannersTab(ev):adminTab==='polls'?renderAdminPollsTab(ev):renderAdminVpTab(ev));
}

function setAdminTab(tab){adminTab=tab;renderAdmin();}

function renderAdminEventTab(ev){
  if(!ev)return '<div style="color:var(--muted);padding:20px">Kein Event aktiv</div>';
  var evId=ev.id,payments=eventPayments[evId]||{},participants=currentParticipants();
  return '<div class="admin-section"><h3>Steuerung</h3>'+
    '<div class="toggle-row"><span style="font-size:13px;color:var(--text)">Button-Modus</span>'+
      '<label class="toggle-switch"><input type="checkbox"'+(controlMode==='button'?' checked':'')+' onchange="controlMode=this.checked?\'button\':\'swipe\';renderAll()"><span class="toggle-slider"></span></label></div></div>'+
    '<div class="admin-section"><h3>Buffet</h3>'+
      '<div class="toggle-row"><span style="font-size:13px;color:var(--text)">Buffet aktiviert</span>'+
        '<label class="toggle-switch"><input type="checkbox"'+(ev.hasBuffet?' checked':'')+' onchange="toggleBuffet(\''+evId+'\',this.checked)"><span class="toggle-slider"></span></label></div></div>'+
    '<div class="admin-section"><h3>Zahlung</h3>'+
      '<label>Betrag</label><input id="pay-amount" value="'+(ev.payAmount||'35€')+'">'+
      '<label>PayPal-Link</label><input id="pay-link" value="'+(ev.paypalLink||'')+'">'+
      '<button class="btn btn-sm btn-primary" style="margin-top:8px" onclick="savePaySettings()">Speichern</button>'+
      '<div class="sec-hdr" style="margin-top:12px">Zahlungsstatus</div>'+
      participants.map(function(p){
        return '<div class="participant-row">'+
          '<div class="p-avatar" style="background:'+p.color+'22;color:'+p.color+'">'+p.name.slice(0,2).toUpperCase()+'</div>'+
          '<div style="flex:1;font-size:13px;color:var(--text)">'+escHtml(p.name)+'</div>'+
          '<button class="btn btn-sm '+((payments[p.id])?'btn-primary':'btn-ghost')+'" onclick="togglePayment(\''+evId+'\',\''+p.id+'\')">'+(payments[p.id]?'✓ Bezahlt':'Nicht bezahlt')+'</button></div>';
      }).join('')+'</div>';
}

function renderAdminBannersTab(ev){
  if(!ev)return '<div style="color:var(--muted);padding:20px">Kein Event aktiv</div>';
  var evId=ev.id;
  var totalUsers=Object.keys(userMemberships).filter(function(uid){return(userMemberships[uid]||[]).indexOf(evId)>=0;}).length||1;
  var evBanners=banners.filter(function(b){return b.eventId===evId&&!b.deleted;});
  return '<div class="admin-section"><h3>Neue Nachricht</h3>'+
    '<label>Text</label><textarea id="banner-text" rows="3" placeholder="Wichtige Nachricht..."></textarea>'+
    '<label>Anzeigedatum</label>'+
    '<div class="trigger-row">'+
      '<button class="trigger-opt'+(adminBannerTrigger==='date'?' active':'')+'" onclick="adminBannerTrigger=\'date\';renderAdmin()">Festes Datum</button>'+
      '<button class="trigger-opt'+(adminBannerTrigger==='daysbefore'?' active':'')+'" onclick="adminBannerTrigger=\'daysbefore\';renderAdmin()">X Tage vor Event</button></div>'+
    (adminBannerTrigger==='date'?'<input id="banner-date" type="date" style="margin-top:8px">':
      '<div style="display:flex;align-items:center;gap:8px;margin-top:8px"><input id="banner-days" type="number" min="1" max="365" placeholder="30" style="width:80px"><span style="color:var(--muted);font-size:13px">Tage vor Anreise</span></div>')+
    '<button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="createBanner()">Banner erstellen</button></div>'+
    (evBanners.length?'<div class="admin-section"><h3>Aktive Banner</h3>'+
      evBanners.map(function(b){
        var trigInfo=b.triggerType==='date'?('ab '+b.triggerDate):('ab '+b.daysBefore+' Tage vor Event');
        return '<div style="padding:8px 0;border-bottom:1px solid #333">'+
          '<div style="font-size:13px;color:var(--text);margin-bottom:4px">'+escHtml(b.text)+'</div>'+
          '<div style="font-size:11px;color:var(--muted)">'+trigInfo+' · Gelesen: '+b.readBy.length+'/'+totalUsers+'</div>'+
          '<button class="btn btn-sm btn-danger" style="margin-top:6px" onclick="deleteBanner(\''+b.id+'\')">Löschen</button></div>';
      }).join('')+'</div>':'');
}

function renderAdminPollsTab(ev){
  if(!ev)return '<div style="color:var(--muted);padding:20px">Kein Event aktiv</div>';
  var evId=ev.id,evPolls=polls.filter(function(p){return p.eventId===evId;});
  return '<div class="admin-section"><h3>Neue Umfrage</h3>'+
    '<label>Frage</label><input id="poll-question" placeholder="Welche Pizza?">'+
    '<label>Optionen (min. 2)</label>'+
    [0,1,2,3].map(function(i){return '<input id="poll-opt-'+i+'" placeholder="Option '+(i+1)+(i>1?' (optional)':'')+'" style="margin-bottom:6px">';}).join('')+
    '<button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="createPoll()">Umfrage erstellen</button></div>'+
    (evPolls.length?'<div class="admin-section"><h3>Umfragen</h3>'+
      evPolls.map(function(p){
        var total=Object.keys(p.votes).length;
        return '<div style="padding:8px 0;border-bottom:1px solid #333">'+
          '<div style="font-size:13px;font-weight:600;color:var(--text)">'+escHtml(p.question)+'</div>'+
          p.options.map(function(opt,i){var cnt=Object.values(p.votes).filter(function(v){return v===i;}).length;return '<div style="font-size:12px;color:var(--muted);margin-top:3px">'+escHtml(opt)+': '+cnt+' ('+(total>0?Math.round(cnt/total*100):0)+'%)</div>';}).join('')+
          '<div style="font-size:11px;color:var(--muted);margin-top:4px">'+total+' Stimme'+(total!==1?'n':'')+'</div>'+
          '<button class="btn btn-sm btn-danger" style="margin-top:6px" onclick="deletePoll(\''+p.id+'\')">Löschen</button></div>';
      }).join('')+'</div>':'');
}

function renderAdminVpTab(ev){
  if(!ev)return '<div style="color:var(--muted);padding:20px">Kein Event aktiv</div>';
  var evId=ev.id,evVps=virtualParticipants.filter(function(v){return v.eventId===evId;});
  return '<div class="admin-section"><h3>Fiktiven Nutzer anlegen</h3>'+
    '<label>Name</label><input id="vp-name" placeholder="Max Mustermann">'+
    '<button class="btn btn-primary" style="width:100%;margin-top:10px" onclick="createVirtualParticipant()">Anlegen</button></div>'+
    (evVps.length?'<div class="admin-section"><h3>Fiktive Nutzer</h3>'+
      evVps.map(function(vp){
        return '<div class="participant-row">'+
          '<div class="p-avatar" style="background:#33333377;color:var(--muted)">'+vp.name.slice(0,2).toUpperCase()+'</div>'+
          '<div style="flex:1"><div style="font-size:13px;color:var(--text)">'+escHtml(vp.name)+'</div>'+
          '<div style="font-size:11px;color:var(--muted)">Code: <span class="vp-code">'+vp.code+'</span> · '+(vp.linkedUserId?'Verknüpft':'Noch frei')+'</div></div></div>';
      }).join('')+'</div>':'');
}

function checkAdminPin(){var pin=document.getElementById('admin-pin-input').value;if(pin==='1234'){adminUnlocked=true;renderAdmin();}else alert('Falscher PIN');}
function toggleBuffet(evId,val){var ev=allEvents.find(function(e){return e.id===evId;});if(ev)ev.hasBuffet=val;}
function savePaySettings(){var ev=currentEvent();if(!ev)return;var a=document.getElementById('pay-amount'),l=document.getElementById('pay-link');if(a)ev.payAmount=a.value.trim();if(l)ev.paypalLink=l.value.trim();renderAdmin();}
function togglePayment(evId,pid){if(!eventPayments[evId])eventPayments[evId]={};eventPayments[evId][pid]=!eventPayments[evId][pid];renderAdmin();renderPaypalBanner();}

function createBanner(){
  var text=document.getElementById('banner-text').value.trim();if(!text){alert('Text erforderlich');return;}
  var evId=currentEventId();if(!evId)return;
  var b={id:'bn'+(nextBannerId++),eventId:evId,text:text,readBy:[],deleted:false};
  if(adminBannerTrigger==='date'){var d=document.getElementById('banner-date').value;if(!d){alert('Datum erforderlich');return;}b.triggerType='date';b.triggerDate=d;}
  else{var days=parseInt(document.getElementById('banner-days').value);if(!days||days<1){alert('Tage erforderlich');return;}b.triggerType='daysbefore';b.daysBefore=days;}
  banners.push(b);renderAdmin();
}
function deleteBanner(id){var b=banners.find(function(x){return x.id===id;});if(b)b.deleted=true;renderAdmin();renderBanners();}

function createPoll(){
  var q=document.getElementById('poll-question').value.trim();if(!q){alert('Frage erforderlich');return;}
  var opts=[];for(var i=0;i<4;i++){var el=document.getElementById('poll-opt-'+i);if(el&&el.value.trim())opts.push(el.value.trim());}
  if(opts.length<2){alert('Mindestens 2 Optionen');return;}
  polls.push({id:'pl'+(nextPollId++),eventId:currentEventId(),question:q,options:opts,votes:{}});
  renderAdmin();
}
function deletePoll(id){polls=polls.filter(function(x){return x.id!==id;});renderAdmin();renderPolls();}

function createVirtualParticipant(){
  var name=document.getElementById('vp-name').value.trim();if(!name){alert('Name erforderlich');return;}
  var evId=currentEventId();if(!evId)return;
  var code='VP-'+name.slice(0,3).toUpperCase()+(Math.floor(Math.random()*900)+100);
  var id='vp'+(nextVpId++);
  virtualParticipants.push({id:id,name:name,code:code,eventId:evId,linkedUserId:null});
  if(!eventParticipants[evId])eventParticipants[evId]=[];
  eventParticipants[evId].push({id:id,name:name,color:'#666666'});
  renderAdmin();
}

// ============================================================
// UTILS
// ============================================================
function escHtml(str){if(!str)return '';return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ============================================================
// INIT
// ============================================================
function init(){
  updateAvatars();
  if((userMemberships[currentUserId]||[]).length===0)showJoinScreen();
  else showScreen('list');
}
init();
</script>
</body>
</html>
