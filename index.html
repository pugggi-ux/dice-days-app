<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Dice Days</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
:root{--tan:#B8A082;--bg:#121212;--surface:#1E1E1E;--card:#2A2A2A;--text:#FFF;--text2:#AAA;--success:#4CAF50;--yellow:#FFC107;--danger:#EF5350;--safe-top:env(safe-area-inset-top,20px);--safe-bot:env(safe-area-inset-bottom,0px)}

/* Desktop: center a phone-sized column */
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0a0a0a;color:var(--text);overflow:hidden;height:100dvh;display:flex;align-items:stretch;justify-content:center}
#app{background:var(--bg);width:100%;max-width:430px;display:flex;flex-direction:column;overflow:hidden;position:relative}
@media(min-width:500px){#app{box-shadow:0 0 60px rgba(0,0,0,.8)}}

.screen{display:none;flex-direction:column;flex:1;overflow:hidden}
.screen.active{display:flex}
.app-bar{padding:12px 16px;padding-top:calc(var(--safe-top)+8px);background:var(--surface);display:flex;align-items:center;justify-content:space-between;min-height:56px;gap:8px}
.app-bar h1{font-size:18px;font-weight:700;white-space:nowrap}
.app-bar-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.event-code{background:rgba(184,160,130,.15);color:var(--tan);font-weight:700;font-size:13px;padding:4px 10px;border-radius:12px}
.info-btn{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--text2);color:var(--text2);background:none;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.icon-btn{width:36px;height:36px;border-radius:50%;border:none;color:var(--tan);background:rgba(184,160,130,.12);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.filters{display:flex;gap:8px;padding:8px 16px;overflow-x:auto;flex-shrink:0}
.filters::-webkit-scrollbar{display:none}
.filter-chip{padding:6px 14px;border-radius:16px;font-size:13px;font-weight:600;border:1px solid #555;color:var(--text2);cursor:pointer;white-space:nowrap;flex-shrink:0}
.filter-chip.active{background:var(--tan);color:#fff;border-color:var(--tan)}
.scroll-list{flex:1;overflow-y:auto;padding:8px 12px 90px;-webkit-overflow-scrolling:touch}
.swipe-wrap{position:relative;margin-bottom:10px;overflow:visible}
.wagon{position:absolute;top:0;height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;border-radius:12px;color:#fff;z-index:0}
.wagon-hide{right:0;width:100%;background:var(--danger);justify-content:flex-end;padding-right:20px}
.wagon-interest{left:0;width:0;background:var(--success);overflow:hidden;white-space:nowrap;padding:0;border-radius:12px 0 0 12px}
.wagon-explain{left:0;width:0;background:var(--yellow);overflow:hidden;white-space:nowrap;padding:0;color:#000;border-radius:12px 0 0 12px}
.wagon-remove{right:0;width:100%;background:var(--danger);justify-content:flex-end;padding-right:16px}
.wagon-need{left:0;width:0;background:var(--success);overflow:hidden;white-space:nowrap;padding:0;border-radius:12px 0 0 12px}
.wagon.tappable{cursor:pointer;padding:0 14px;z-index:3}
.game-card{position:relative;background:var(--card);border-radius:12px;overflow:hidden;display:flex;align-items:stretch;z-index:2;touch-action:pan-y}
.game-cover{width:72px;min-height:80px;background-size:cover;background-position:center;flex-shrink:0;pointer-events:none}
.game-body{padding:8px 0 8px 10px;flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;pointer-events:none}
.game-bottleneck{font-size:11px;color:var(--danger);font-weight:600;margin-bottom:1px}
.game-name{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-meta{font-size:12px;color:var(--text2);margin-top:2px}
.game-badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:4px}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:600}
.badge-neutral{background:rgba(255,255,255,.08);color:var(--text2)}
.badge-int-me{background:rgba(76,175,80,.2);color:var(--success)}
.badge-exp-me{background:rgba(255,193,7,.2);color:var(--yellow)}
.badge-yellow{background:rgba(255,193,7,.15);color:var(--yellow)}
.sweet-spot{width:36px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin:0 10px;pointer-events:none}
.bottom-nav{background:var(--surface);display:flex;border-top:1px solid #333;padding-bottom:var(--safe-bot)}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;padding:6px 0;cursor:pointer;color:var(--text2);font-size:10px;gap:1px}
.nav-item.active{color:var(--tan)}
.nav-item .icon{font-size:20px}
.inbox-card{position:relative;background:var(--card);border-radius:12px;padding:10px;display:flex;align-items:center;gap:10px;z-index:2;height:72px;touch-action:pan-y}
.inbox-card img{width:52px;height:52px;border-radius:8px;object-fit:cover;pointer-events:none}
.inbox-card-info{flex:1;min-width:0;pointer-events:none}
.inbox-card-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inbox-card-meta{font-size:12px;color:var(--text2)}
.toast{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 16px;border-radius:20px;font-size:13px;z-index:100;display:none;align-items:center;gap:10px;white-space:nowrap;max-width:90%}
.toast.show{display:flex}
.toast-undo{color:var(--tan);font-weight:700;cursor:pointer;border:none;background:none;font-size:13px;padding:0}
.detail-header{position:relative;height:200px;background-size:cover;background-position:center;flex-shrink:0}
.detail-header::after{content:'';position:absolute;bottom:0;left:0;right:0;height:80px;background:linear-gradient(transparent,var(--bg))}
.btn-back{position:absolute;top:calc(var(--safe-top)+8px);left:12px;width:36px;height:36px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;border:none;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:2}
.detail-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.detail-content{padding:0 16px 120px}
.detail-title-row{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.detail-title{font-size:20px;font-weight:700}
.detail-status{font-size:13px;margin-bottom:4px}
.detail-status.green{color:var(--success)}
.detail-status.red{color:var(--danger)}
.detail-desc{font-size:13px;color:var(--text2);margin-bottom:16px;line-height:1.4}
.detail-meta{color:var(--text2);font-size:13px;margin-bottom:12px}
.role-columns{display:flex;gap:16px;margin-bottom:16px}
.role-col{flex:1}
.role-col-header{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.role-col-title{font-size:14px;font-weight:700}
.role-add{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--tan);color:var(--tan);display:flex;align-items:center;justify-content:center;font-size:14px;cursor:pointer;background:none}
.role-chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:3px;padding:4px 10px;border-radius:14px;font-size:12px;font-weight:500}
.chip-exp{background:rgba(255,193,7,.15);color:var(--yellow)}
.chip-sup{background:rgba(76,175,80,.15);color:var(--success)}
.chip-remove{font-size:10px;cursor:pointer;opacity:.7;margin-left:2px}
.chip-me-exp{background:rgba(255,193,7,.25);color:var(--yellow)}
.chip-me{background:rgba(184,160,130,.2);color:var(--tan)}
.interest-section{margin-bottom:16px}
.interest-header{font-size:14px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.need-count{color:var(--success);font-size:13px}
.interest-chips{display:flex;flex-wrap:wrap;gap:5px}
.chip-interest{background:rgba(255,255,255,.08);color:var(--text)}
.chip-interest-me{background:rgba(184,160,130,.2);color:var(--tan)}
.chip-interest-me-exp{background:rgba(255,193,7,.25);color:var(--yellow)}
.chip-need-icon{color:var(--success);font-size:11px;margin-left:2px}
.action-bar{position:absolute;bottom:52px;left:0;right:0;padding:10px 16px;padding-bottom:calc(8px + var(--safe-bot));display:flex;gap:10px;background:linear-gradient(transparent,var(--bg) 20%)}
.action-btn{flex:1;padding:12px;border-radius:12px;font-size:13px;font-weight:700;border:none;cursor:pointer;text-align:center}
.btn-green{background:var(--success);color:#fff}
.btn-grey{background:#444;color:#aaa}
.btn-need{background:rgba(76,175,80,.15);color:var(--success);border:1.5px solid var(--success)}
.btn-need-off{background:#333;color:var(--text2);border:1.5px solid #555}
.picker-overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:200;display:none;align-items:flex-end;justify-content:center}
.picker-overlay.show{display:flex}
.picker-sheet{background:var(--surface);border-radius:16px 16px 0 0;padding:20px 16px;padding-bottom:calc(20px + var(--safe-bot));width:100%;max-height:70vh;overflow-y:auto}
.picker-title{font-size:16px;font-weight:700;margin-bottom:12px}
.picker-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #333;cursor:pointer}
.picker-check{width:22px;height:22px;border-radius:6px;border:2px solid #555;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.picker-check.checked{background:var(--tan);border-color:var(--tan);color:#fff}
.picker-name{font-size:14px}
.picker-close{margin-top:12px;width:100%;padding:10px;border-radius:10px;background:var(--tan);color:#fff;border:none;font-size:14px;font-weight:700;cursor:pointer}
.empty-state{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:15px;padding:40px;text-align:center;flex-direction:column;gap:8px}
.pack-section{margin-bottom:20px}
.pack-section-title{font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px;padding:0 4px}
.pack-item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--card);border-radius:10px;margin-bottom:6px;cursor:pointer}
.pack-check{width:22px;height:22px;border-radius:50%;border:2px solid #555;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;transition:all .2s}
.pack-check.done{background:var(--success);border-color:var(--success);color:#fff}
.pack-label{flex:1;font-size:14px}
.pack-label.done{text-decoration:line-through;color:var(--text2)}
.pack-source{font-size:11px;color:var(--text2)}
.pack-add-row{display:flex;gap:8px;margin-bottom:16px;padding:0 4px}
.pack-input{flex:1;background:var(--card);border:1px solid #444;border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px;outline:none}
.pack-input:focus{border-color:var(--tan)}
.pack-add-btn{padding:10px 16px;border-radius:10px;background:var(--tan);color:#fff;border:none;font-weight:700;font-size:14px;cursor:pointer}
.add-sheet{background:var(--surface);border-radius:16px 16px 0 0;padding:20px 16px;padding-bottom:calc(20px + var(--safe-bot));width:100%;max-height:80vh;overflow-y:auto}
.add-tabs{display:flex;gap:8px;margin-bottom:16px}
.add-tab{flex:1;padding:8px;border-radius:10px;font-size:13px;font-weight:700;text-align:center;cursor:pointer;border:1px solid #555;color:var(--text2)}
.add-tab.active{background:var(--tan);color:#fff;border-color:var(--tan)}
.search-input{width:100%;background:var(--card);border:1px solid #444;border-radius:10px;padding:10px 12px;color:var(--text);font-size:14px;outline:none;margin-bottom:12px}
.search-input:focus{border-color:var(--tan)}
.search-result{display:flex;align-items:center;gap:10px;padding:10px;background:var(--card);border-radius:10px;margin-bottom:8px;cursor:pointer}
.search-result img{width:48px;height:48px;border-radius:6px;object-fit:cover}
.search-result-info{flex:1;min-width:0}
.search-result-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-result-meta{font-size:12px;color:var(--text2)}
.search-result .added-mark{color:var(--success);font-size:18px;flex-shrink:0}
.collection-tag{font-size:10px;padding:2px 6px;border-radius:8px;background:rgba(184,160,130,.15);color:var(--tan);font-weight:600;margin-left:6px}
.time-summary{background:var(--card);border-radius:12px;padding:12px 16px;margin:0 0 12px;display:flex;justify-content:space-around;text-align:center}
.time-stat{display:flex;flex-direction:column;gap:2px}
.time-stat-val{font-size:20px;font-weight:700;color:var(--tan)}
.time-stat-label{font-size:11px;color:var(--text2)}
</style>
</head>
<body>
<div id="app">

<div id="screen-list" class="screen active">
  <div class="app-bar"><h1>Dice Days 12</h1><div class="app-bar-right"><span class="event-code">ABC123</span><button class="icon-btn" onclick="openAddGame()">+</button></div></div>
  <div class="filters" id="filters"></div>
  <div class="scroll-list" id="game-list"></div>
</div>

<div id="screen-detail" class="screen">
  <div class="detail-header" id="detail-header"><button class="btn-back" onclick="goBackFromDetail()">&#8249;</button></div>
  <div class="detail-scroll"><div class="detail-content" id="detail-content"></div></div>
  <div class="action-bar" id="detail-actions"></div>
</div>

<div id="screen-inbox" class="screen">
  <div class="app-bar"><h1>Inbox</h1><div class="app-bar-right"><button class="info-btn" onclick="toggleInboxInfo()">i</button></div></div>
  <div id="inbox-info" style="display:none;padding:8px 16px;font-size:12px;color:var(--text2);background:var(--surface);line-height:1.4">Wische nach <b style="color:var(--success)">rechts</b> für Interesse (weiter für Erklärbedarf). Nach <b style="color:var(--danger)">links</b> zum Ausblenden.</div>
  <div class="scroll-list" id="inbox-list"></div>
</div>

<div id="screen-mitspielen" class="screen">
  <div class="app-bar"><h1>Mitspielen</h1></div>
  <div class="scroll-list" id="mitspielen-list"></div>
</div>

<div id="screen-erklaeren" class="screen">
  <div class="app-bar"><h1>Erklären</h1></div>
  <div class="scroll-list" id="erklaeren-list"></div>
</div>

<div id="screen-packliste" class="screen">
  <div class="app-bar"><h1>Packliste</h1></div>
  <div class="scroll-list" id="packliste-content" style="padding-top:12px"></div>
</div>

<div class="toast" id="toast"><span id="toast-text"></span><button class="toast-undo" onclick="undoLast()">Rückgängig</button></div>

<div class="picker-overlay" id="picker" onclick="if(event.target===this)closePicker()">
  <div class="picker-sheet"><div class="picker-title" id="picker-title"></div><div id="picker-list"></div><button class="picker-close" onclick="closePicker()">Fertig</button></div>
</div>

<div class="picker-overlay" id="add-overlay" onclick="if(event.target===this)closeAddGame()">
  <div class="add-sheet">
    <div class="picker-title">Spiel hinzufügen</div>
    <div class="add-tabs">
      <div class="add-tab active" id="tab-collection" onclick="switchAddTab('collection')">Meine Sammlung</div>
      <div class="add-tab" id="tab-search" onclick="switchAddTab('search')">BGG-Suche</div>
      <div class="add-tab" id="tab-wish" onclick="switchAddTab('wish')">Wunsch</div>
    </div>
    <input class="search-input" id="add-search" placeholder="Suchen..." oninput="filterAddList()">
    <div id="add-results"></div>
    <button class="picker-close" onclick="closeAddGame()" style="margin-top:12px">Schließen</button>
  </div>
</div>

<div class="bottom-nav">
  <div class="nav-item active" data-s="list" onclick="switchTab(this,'list')"><span class="icon">☰</span>Spiele</div>
  <div class="nav-item" data-s="inbox" onclick="switchTab(this,'inbox')"><span class="icon">✉</span>Inbox</div>
  <div class="nav-item" data-s="mitspielen" onclick="switchTab(this,'mitspielen')"><span class="icon">🎲</span>Mitspielen</div>
  <div class="nav-item" data-s="erklaeren" onclick="switchTab(this,'erklaeren')"><span class="icon">💡</span>Erklären</div>
  <div class="nav-item" data-s="packliste" onclick="switchTab(this,'packliste')"><span class="icon">🎒</span>Packliste</div>
</div>

</div><!-- #app -->

function flameSVG(sz){const w=sz*.6,h=sz*.85,ox=(sz-w)/2,oy=(sz-h)/2;return`<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" fill="none"><path d="M${ox+w*.5},${oy} C${ox+w*.5},${oy+h*.35} ${ox+w},${oy+h*.25} ${ox+w},${oy+h*.6} C${ox+w},${oy+h*.85} ${ox+w*.75},${oy+h} ${ox+w*.5},${oy+h} C${ox+w*.25},${oy+h} ${ox},${oy+h*.85} ${ox},${oy+h*.6} C${ox},${oy+h*.25} ${ox+w*.5},${oy+h*.35} ${ox+w*.5},${oy}" stroke="var(--success)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;}
function ssSVG(r,sz=36){if(r>1)return flameSVG(sz);const rd=sz/2-2,c=sz/2,sw=3,a=2*Math.PI*Math.min(r,1),x=c+rd*Math.sin(a),y=c-rd*Math.cos(a),lg=r>.5?1:0;const arc=r>0?`<path d="M${c},${c-rd} A${rd},${rd} 0 ${lg} 1 ${x.toFixed(1)},${y.toFixed(1)}" fill="none" stroke="var(--success)" stroke-width="${sw}" stroke-linecap="round"/>`:'';return`<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}"><circle cx="${c}" cy="${c}" r="${rd}" fill="none" stroke="#444" stroke-width="${sw}"/>${arc}</svg>`;}
function bn(g){const b=[];if(!g.explainers.length)b.push('Kein Erklärer');if(!g.suppliers.length)b.push('Kein Lieferant');return b;}

const SNAP=70,FLY=160,WW=90;let touchState={};
function gTX(el){const m=el.style.transform.match(/translateX\(([^)]+)\)/);return m?parseFloat(m[1]):0;}
function swS(e,k,c){if(snappedCardId&&snappedCardId!==k)unsnap(snappedCardId);const t=e.touches[0];touchState[k]={sX:t.clientX,sY:t.clientY,oX:gTX(c),moved:false};c.style.transition='none';}
function swM(e,k,c,wi,we){const ts=touchState[k];if(!ts)return;const t=e.touches[0],dx=t.clientX-ts.sX,dy=t.clientY-ts.sY;if(!ts.moved&&Math.abs(dy)>Math.abs(dx))return;ts.moved=true;e.preventDefault();const tx=ts.oX+dx;c.style.transform=`translateX(${tx}px)`;if(tx>0){const iw=Math.min(tx,WW);wi.style.width=iw+'px';wi.style.padding=iw>20?'0 12px':'0';if(tx>WW){const ew=Math.min(tx-WW,WW);we.style.width=ew+'px';we.style.padding=ew>20?'0 12px':'0';we.style.left=iw+'px';}else{we.style.width='0';we.style.padding='0';}}else{wi.style.width='0';wi.style.padding='0';we.style.width='0';we.style.padding='0';}}
function swE(k,c,gid,onRight,onLeft){const ts=touchState[k];if(!ts)return;const tx=gTX(c);c.style.transition='transform .3s ease';if(tx<-FLY){c.style.transform='translateX(-120%)';setTimeout(()=>onLeft(gid),300);}else if(tx>FLY){c.style.transform='translateX(120%)';setTimeout(()=>onRight(gid,false),300);}else if(tx>=SNAP){snap(k,gid,onRight);}else{resetC(k);}delete touchState[k];}
function snap(k,gid,onRight){snappedCardId=k;const c=document.getElementById('sc-'+k),wi=document.getElementById('wi-'+k),we=document.getElementById('we-'+k);c.style.transition='transform .25s ease';c.style.transform=`translateX(${WW*2}px)`;wi.style.width=WW+'px';wi.style.padding='0 12px';we.style.width=WW+'px';we.style.padding='0 10px';we.style.left=WW+'px';wi.classList.add('tappable');we.classList.add('tappable');wi.onclick=()=>onRight(gid,false);we.onclick=()=>onRight(gid,true);}
function unsnap(k){if(snappedCardId===k)snappedCardId=null;resetC(k);}
function resetC(k){const c=document.getElementById('sc-'+k),wi=document.getElementById('wi-'+k),we=document.getElementById('we-'+k);if(!c)return;c.style.transition='transform .25s ease';c.style.transform='translateX(0)';wi.style.width='0';wi.style.padding='0';wi.classList.remove('tappable');wi.onclick=null;we.style.width='0';we.style.padding='0';we.classList.remove('tappable');we.onclick=null;if(snappedCardId===k)snappedCardId=null;}
function attachSw(k,gid,onR,onL){const c=document.getElementById('sc-'+k),wi=document.getElementById('wi-'+k),we=document.getElementById('we-'+k);c.addEventListener('touchstart',e=>swS(e,k,c),{passive:true});c.addEventListener('touchmove',e=>swM(e,k,c,wi,we),{passive:false});c.addEventListener('touchend',()=>swE(k,c,gid,onR,onL));}

function attachMitSw(k,gid){
  const c=document.getElementById('sc-'+k),wl=document.getElementById('wl-'+k),wr=document.getElementById('wr-'+k);
  let ts2={};
  c.addEventListener('touchstart',e=>{if(snappedCardId&&snappedCardId!==k)unsnap(snappedCardId);const t=e.touches[0];ts2={sX:t.clientX,sY:t.clientY,oX:gTX(c),moved:false};c.style.transition='none';},{passive:true});
  c.addEventListener('touchmove',e=>{const t=e.touches[0],dx=t.clientX-ts2.sX,dy=t.clientY-ts2.sY;if(!ts2.moved&&Math.abs(dy)>Math.abs(dx))return;ts2.moved=true;e.preventDefault();const tx=ts2.oX+dx;c.style.transform=`translateX(${tx}px)`;if(tx>0){wr.style.width=Math.min(tx,120)+'px';wr.style.padding=tx>20?'0 16px':'0';wl.style.width='0';wl.style.padding='0';}else if(tx<0){wl.style.width=Math.min(-tx,120)+'px';wl.style.padding=-tx>20?'0 16px':'0';wr.style.width='0';wr.style.padding='0';}else{wl.style.width='0';wl.style.padding='0';wr.style.width='0';wr.style.padding='0';}},{passive:false});
  c.addEventListener('touchend',()=>{const tx=gTX(c);c.style.transition='transform .3s ease';if(tx>FLY){c.style.transform='translateX(120%)';setTimeout(()=>mitRemoveInterest(gid),300);}else if(tx<-FLY){mitToggleNeed(gid);c.style.transform='translateX(0)';wl.style.width='0';wl.style.padding='0';}else{c.style.transform='translateX(0)';wl.style.width='0';wl.style.padding='0';wr.style.width='0';wr.style.padding='0';}});
}

function doInterest(gid,withNeed){const g=games.find(x=>x.id===gid);if(!g)return;if(!g.interested.includes(ME))g.interested.push(ME);if(withNeed&&!g.needsExplain.includes(ME))g.needsExplain.push(ME);lastAction={type:'interest',id:gid,withNeed};snappedCardId=null;renderAll();showToast(`${g.name} — Interesse${withNeed?' + Erklärbedarf':''}`);}
function doHide(gid){const g=games.find(x=>x.id===gid);if(!g)return;if(!g.hidden.includes(ME))g.hidden.push(ME);lastAction={type:'hide',id:gid};snappedCardId=null;renderAll();showToast(`${g.name} — ausgeblendet`);}
function mitRemoveInterest(gid){const g=games.find(x=>x.id===gid);if(!g)return;g.interested=g.interested.filter(p=>p!==ME);g.needsExplain=g.needsExplain.filter(p=>p!==ME);g.explainers=g.explainers.filter(p=>p!==ME);g.suppliers=g.suppliers.filter(p=>p!==ME);lastAction={type:'mit-remove',id:gid};snappedCardId=null;renderAll();showToast(`${g.name} — Interesse entfernt`);}
function mitToggleNeed(gid){const g=games.find(x=>x.id===gid);if(!g)return;const i=g.needsExplain.indexOf(ME);if(i>=0)g.needsExplain.splice(i,1);else g.needsExplain.push(ME);renderAll();showToast(`${g.name} — Erklärbedarf ${g.needsExplain.includes(ME)?'an':'aus'}`);}
function undoLast(){if(!lastAction)return;const g=games.find(x=>x.id===lastAction.id);if(!g)return;if(lastAction.type==='interest'){g.interested=g.interested.filter(p=>p!==ME);if(lastAction.withNeed)g.needsExplain=g.needsExplain.filter(p=>p!==ME);}else if(lastAction.type==='hide'){g.hidden=g.hidden.filter(p=>p!==ME);}else if(lastAction.type==='mit-remove'){g.interested.push(ME);}lastAction=null;hideToast();renderAll();}

  return`<div class="swipe-wrap">${wagons}<div class="game-card" id="sc-${key}"><div class="game-cover" style="background-image:url('${g.img}')"></div><div class="game-body">${bnText}<div class="game-name">${g.name}</div><div class="game-meta">${g.min}–${g.max} Sp. · ${g.time} Min · ${g.weight}</div><div class="game-badges">${badges}</div></div><div class="sweet-spot">${ssSVG(ratio)}</div></div></div>`;

  const nc=g.needsExplain.length;
  const ic=g.interested.map(p=>{const meE=p===ME&&isExp,isMe=p===ME;const cls=meE?'chip chip-interest-me-exp':isMe?'chip chip-interest-me':'chip chip-interest';const ni=g.needsExplain.includes(p)?'<span class="chip-need-icon">❔</span>':'';return`<span class="${cls}">${pName(p)}${ni}</span>`;}).join('');
  document.getElementById('detail-content').innerHTML=`<div class="detail-title-row"><span class="detail-title">${g.name}</span>${ssSVG(ratio,28)}</div><div class="detail-meta">${g.min}–${g.max} Spieler · ${g.time} Min · Gewicht ${g.weight}</div>${sl}<div class="detail-desc">${g.desc||''}</div><div class="role-columns"><div class="role-col"><div class="role-col-header"><span class="role-col-title">Erklärer</span><button class="role-add" onclick="openPicker('${id}','explainers')">+</button></div><div class="role-chips">${ec}</div></div><div class="role-col"><div class="role-col-header"><span class="role-col-title">Lieferant</span><button class="role-add" onclick="openPicker('${id}','suppliers')">+</button></div><div class="role-chips">${sc2}</div></div></div><div class="interest-section"><div class="interest-header">Interessenten ${g.interested.length}${nc?` <span class="need-count">(❔ ${nc})</span>`:''}</div><div class="interest-chips">${ic||'<span style="color:var(--text2);font-size:12px">Noch keine</span>'}</div></div>`;
  let acts='';if(isInt){acts+=`<button class="action-btn btn-grey" onclick="toggleInterest('${id}')">♡̸ Zurückziehen</button>`;if(!isExp){const hasN=g.needsExplain.includes(ME);acts+=`<button class="action-btn ${hasN?'btn-need':'btn-need-off'}" onclick="toggleNeed('${id}')">${hasN?'❔ Bedarf an':'❔ Bedarf aus'}</button>`;}}else{acts+=`<button class="action-btn btn-green" onclick="toggleInterest('${id}')">♥ Interesse</button>`;}
  document.getElementById('detail-actions').innerHTML=acts;
  showScreen('detail');
}
function toggleInterest(id){const g=games.find(x=>x.id===id);if(!g)return;const i=g.interested.indexOf(ME);if(i>=0){g.interested.splice(i,1);g.needsExplain=g.needsExplain.filter(p=>p!==ME);g.explainers=g.explainers.filter(p=>p!==ME);g.suppliers=g.suppliers.filter(p=>p!==ME);}else g.interested.push(ME);openDetail(id);renderAll();}
function toggleNeed(id){const g=games.find(x=>x.id===id);if(!g)return;const i=g.needsExplain.indexOf(ME);if(i>=0)g.needsExplain.splice(i,1);else g.needsExplain.push(ME);openDetail(id);}
function removeRole(gid,role,pid){const g=games.find(x=>x.id===gid);if(!g)return;g[role]=g[role].filter(p=>p!==pid);openDetail(gid);renderAll();}
let pickerGame=null,pickerRole=null;
function openPicker(gid,role){pickerGame=gid;pickerRole=role;document.getElementById('picker-title').textContent=role==='explainers'?'Erklärer auswählen':'Lieferant auswählen';renderPickerList();document.getElementById('picker').classList.add('show');}
function renderPickerList(){const g=games.find(x=>x.id===pickerGame);document.getElementById('picker-list').innerHTML=participants.map(p=>{const ch=g[pickerRole].includes(p.id);return`<div class="picker-item" onclick="togglePickerItem('${p.id}')"><div class="picker-check${ch?' checked':''}">${ch?'✓':''}</div><span class="picker-name">${p.name}</span></div>`;}).join('');}
function togglePickerItem(pid){const g=games.find(x=>x.id===pickerGame);const i=g[pickerRole].indexOf(pid);if(i>=0)g[pickerRole].splice(i,1);else{g[pickerRole].push(pid);if(pickerRole==='explainers')g.needsExplain=g.needsExplain.filter(p=>p!==pid);}renderPickerList();openDetail(pickerGame);renderAll();}
function closePicker(){document.getElementById('picker').classList.remove('show');}

function openAddGame(){addTabMode='collection';document.getElementById('add-search').value='';document.getElementById('add-overlay').classList.add('show');switchAddTab('collection');}
function closeAddGame(){document.getElementById('add-overlay').classList.remove('show');}
function switchAddTab(tab){addTabMode=tab;document.querySelectorAll('.add-tab').forEach(t=>t.classList.remove('active'));document.getElementById('tab-'+tab).classList.add('active');const si=document.getElementById('add-search');si.placeholder=tab==='collection'?'In deiner Sammlung suchen…':tab==='search'?'BGG-Suche…':'Spielname eingeben…';si.value='';filterAddList();}
function filterAddList(){
  const q=document.getElementById('add-search').value.toLowerCase(),el=document.getElementById('add-results');
  if(addTabMode==='wish'){if(!q){el.innerHTML='<div style="color:var(--text2);font-size:13px;padding:8px">Name eingeben und hinzufügen</div>';return;}const ex=games.find(g=>g.name.toLowerCase()===q);el.innerHTML=`<div class="search-result" onclick="addWish('${q.replace(/'/g,"\\'")}')"><div class="search-result-info"><div class="search-result-name">${q}</div><div class="search-result-meta">Als Wunsch hinzufügen</div></div>${ex?'<span class="added-mark">✓</span>':''}</div>`;return;}
  const src=addTabMode==='collection'?myCollection:bggSearchDb;
  const fil=q?src.filter(s=>s.name.toLowerCase().includes(q)):src;
  el.innerHTML=fil.map(s=>{const ad=games.find(g=>g.name===s.name),inC=myCollection.find(c=>c.name===s.name);return`<div class="search-result" onclick="addFromSearch('${s.name.replace(/'/g,"\\'")}','${s.img}',${s.min},${s.max},${s.time},${s.weight})"><img src="${s.img}" alt=""><div class="search-result-info"><div class="search-result-name">${s.name}${inC&&addTabMode==='search'?'<span class="collection-tag">Sammlung</span>':''}</div><div class="search-result-meta">${s.min}–${s.max} Sp. · ${s.time} Min · ${s.weight}</div></div>${ad?'<span class="added-mark">✓</span>':''}</div>`;}).join('')||'<div style="color:var(--text2);font-size:13px;padding:8px">Keine Ergebnisse</div>';
}
function addFromSearch(name,img,min,max,time,weight){if(games.find(g=>g.name===name)){showToast(name+' ist bereits dabei');return;}games.push({id:'g'+(nextId++),name,img,min,max,time,weight:parseFloat(weight),interested:[ME],explainers:[],suppliers:[ME],needsExplain:[],hidden:[],desc:'',addedBy:ME,source:'offered'});renderAll();filterAddList();showToast(name+' hinzugefügt');}
function addWish(name){if(games.find(g=>g.name.toLowerCase()===name.toLowerCase())){showToast(name+' ist bereits dabei');return;}games.push({id:'g'+(nextId++),name:name.charAt(0).toUpperCase()+name.slice(1),img:'',min:0,max:0,time:0,weight:0,interested:[ME],explainers:[],suppliers:[],needsExplain:[],hidden:[],desc:'',addedBy:ME,source:'wished'});renderAll();filterAddList();showToast(name+' als Wunsch hinzugefügt');}

function showScreen(name){currentScreen=name;document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById('screen-'+name).classList.add('active');if(name!=='detail')document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active',n.dataset.s===name));}
function switchTab(el,screen){showScreen(screen);if(screen==='inbox')renderInbox();if(screen==='mitspielen')renderMitspielen();if(screen==='erklaeren')renderErklaeren();if(screen==='packliste')renderPackliste();}
function showToast(msg){clearTimeout(toastTimer);document.getElementById('toast-text').textContent=msg;document.getElementById('toast').classList.add('show');toastTimer=setTimeout(hideToast,3500);}
function hideToast(){document.getElementById('toast').classList.remove('show');}

renderAll();
</script>
</div>
</body>
</html>
