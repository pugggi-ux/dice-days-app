name: dice_days
description: "Dice Days - Board game event organizer"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.0
  go_router: ^14.0.0
  provider: ^6.1.0
  http: ^1.2.0
  xml: ^6.5.0
  cached_network_image: ^3.4.0
  uuid: ^4.5.0
  shared_preferences: ^2.3.0
  flutter_svg: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
